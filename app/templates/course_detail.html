{% extends "base.html" %}

{% block title %}Курс - ГБУ ДПО «ИРО ЧР»{% endblock %}

{% block extra_css %}
<style>
/* ===== ПЕРЕОПРЕДЕЛЕНИЕ ВСЕХ ЦВЕТОВ ===== */
:root {
    --primary: #1a4f7a !important;
    --primary-dark: #0d3b5e !important;
    --primary-light: #3a7ca5 !important;
    --primary-gradient: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
    --dark: #0d1b2a !important;
    --light: #f7fafc !important;
    --gray: #718096 !important;
    --white: #ffffff !important;
    --border: #e2e8f0 !important;
}

/* ===== ШРИФТЫ ===== */
.course-page * {
    font-family: 'Inter', sans-serif;
}

.course-page h1, 
.course-page h2, 
.course-page h3, 
.course-page h4, 
.course-page h5,
.course-page .section-title,
.course-page .modal-title {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    letter-spacing: 0.02em !important;
}

.course-page .lead,
.course-page .speaker-position,
.course-page .course-description,
.course-page .info-box p {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 500 !important;
    letter-spacing: 0.02em !important;
    font-size: clamp(0.95rem, 2vw, 1.05rem) !important;
    line-height: 1.7 !important;
}

/* ===== ГЕРОЙ ===== */
.course-hero-image {
    width: 100%;
    height: clamp(180px, 35vw, 300px);
    object-fit: cover;
    border-bottom: 3px solid rgba(26, 79, 122, 0.08);
}

.course-placeholder {
    height: clamp(180px, 35vw, 300px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #e8edf3 0%, #d5dfea 50%, #e0e8f0 100%);
    border-bottom: 3px solid rgba(26, 79, 122, 0.08);
}

.course-placeholder i {
    font-size: clamp(2.5rem, 8vw, 4rem);
    color: #1a4f7a;
    opacity: 0.3;
}

/* ===== КАРТОЧКА КУРСА ===== */
.course-page .card {
    border: 1px solid var(--border) !important;
    border-radius: 16px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) !important;
    transition: all 0.3s ease !important;
    background: var(--white) !important;
}

.course-page .card:hover {
    box-shadow: 0 8px 32px rgba(26, 79, 122, 0.06) !important;
}

.course-page .card-body {
    padding: clamp(16px, 3vw, 28px) !important;
}

/* ===== MOODLE БЭДЖ ===== */
.moodle-badge {
    display: inline-block;
    background: rgba(26, 79, 122, 0.08);
    color: #1a4f7a;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 16px;
    border: 1px solid rgba(26, 79, 122, 0.06);
}

.moodle-badge i {
    margin-right: 8px;
}

/* ===== ТЕГИ ===== */
.badge-category {
    display: inline-block;
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%);
    color: white;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: clamp(0.6rem, 1.2vw, 0.7rem);
    font-weight: 600;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.04em;
}

.badge-format {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: clamp(0.6rem, 1.2vw, 0.7rem);
    font-weight: 600;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.04em;
}

.badge-format-online {
    background: #dbeafe;
    color: #1e40af;
}

.badge-format-full_time {
    background: #d1fae5;
    color: #059669;
}

.badge-format-part_time {
    background: #fef3c7;
    color: #92400e;
}

.badge-format-full_part_time {
    background: #fce4ec;
    color: #b71c1c;
}

.badge-hashtag {
    display: inline-block;
    background: rgba(26, 79, 122, 0.06);
    color: #1a4f7a;
    padding: 2px 12px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 500;
    margin: 2px 3px;
    font-family: 'Inter', sans-serif;
}

/* ===== ЗАГОЛОВКИ СЕКЦИЙ ===== */
.section-title {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(1rem, 2vw, 1.15rem) !important;
    color: #0d1b2a !important;
    margin-bottom: 12px !important;
    letter-spacing: 0.02em !important;
}

.section-title i {
    color: #1a4f7a;
    margin-right: 10px;
}

/* ===== ОПИСАНИЕ ===== */
.course-description {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(0.95rem, 2vw, 1.05rem) !important;
    line-height: 1.8 !important;
    color: #3a4a5a !important;
    font-weight: 500 !important;
    letter-spacing: 0.02em !important;
    white-space: pre-line;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

/* ===== ВИДЕО ===== */
.video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 12px;
    background: #0d1b2a;
}

.video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== КНОПКИ ИЗБРАННОГО ===== */
.btn-outline-favorite {
    background: transparent;
    border: 1.5px solid #e2e8f0;
    color: #4a5a6a;
    padding: clamp(6px, 1.2vw, 8px) clamp(14px, 2vw, 18px);
    border-radius: 8px;
    font-size: clamp(0.75rem, 1.5vw, 0.85rem);
    font-weight: 600;
    transition: all 0.3s ease;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.03em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.btn-outline-favorite:hover {
    border-color: #1a4f7a;
    color: #1a4f7a;
    background: rgba(26, 79, 122, 0.04);
}

.btn-outline-favorite.active {
    border-color: #1a4f7a;
    color: #1a4f7a;
    background: rgba(26, 79, 122, 0.08);
}

.btn-outline-favorite:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-outline-favorite:active {
    transform: scale(0.96);
}

.btn-outline-watch {
    background: transparent;
    border: 1.5px solid #e2e8f0;
    color: #4a5a6a;
    padding: clamp(6px, 1.2vw, 8px) clamp(14px, 2vw, 18px);
    border-radius: 8px;
    font-size: clamp(0.75rem, 1.5vw, 0.85rem);
    font-weight: 600;
    transition: all 0.3s ease;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.03em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.btn-outline-watch:hover {
    border-color: #1a4f7a;
    color: #1a4f7a;
    background: rgba(26, 79, 122, 0.04);
}

.btn-outline-watch.active {
    border-color: #1a4f7a;
    color: #1a4f7a;
    background: rgba(26, 79, 122, 0.08);
}

.btn-outline-watch:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-outline-watch:active {
    transform: scale(0.96);
}

/* ===== КНОПКИ В ГРУППЕ ===== */
.btn-group-responsive {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.btn-group-responsive .btn-outline-favorite,
.btn-group-responsive .btn-outline-watch {
    flex: 1 1 auto;
    min-width: fit-content;
    justify-content: center;
    text-align: center;
}

/* ===== СПИКЕРЫ ===== */
.speaker-card {
    text-align: center;
    padding: 16px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 12px;
    border: 1px solid var(--border);
    transition: all 0.3s ease;
    touch-action: manipulation;
}

.speaker-card:active {
    transform: scale(0.98);
}

.speaker-card:hover {
    background: rgba(255, 255, 255, 0.8);
    border-color: #1a4f7a;
    box-shadow: 0 4px 16px rgba(26, 79, 122, 0.06);
}

.speaker-img {
    width: clamp(64px, 12vw, 80px);
    height: clamp(64px, 12vw, 80px);
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #1a4f7a;
    margin-bottom: 10px;
}

.speaker-name {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(0.9rem, 1.8vw, 1rem) !important;
    color: #0d1b2a !important;
    letter-spacing: 0.02em !important;
}

.speaker-position {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(0.8rem, 1.5vw, 0.9rem) !important;
    color: #4a5a6a !important;
    font-weight: 500 !important;
    font-style: italic !important;
    letter-spacing: 0.03em !important;
}

.speaker-bio {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(0.8rem, 1.3vw, 0.85rem) !important;
    color: #5a6a7a !important;
    margin-top: 6px;
    font-weight: 400 !important;
    letter-spacing: 0.02em !important;
}

/* ===== БОКОВАЯ ПАНЕЛЬ ===== */
.sticky-sidebar {
    position: sticky;
    top: 90px;
}

.course-info-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: clamp(16px, 3vw, 24px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
}

.course-info-card hr {
    border-color: var(--border);
    margin: 16px 0;
}

.course-info-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    flex-wrap: wrap;
    gap: 4px;
}

.course-info-item .label {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 600 !important;
    color: #4a5a6a !important;
    font-size: clamp(0.8rem, 1.5vw, 0.9rem) !important;
    letter-spacing: 0.03em !important;
}

.course-info-item .label i {
    color: #1a4f7a;
}

.course-info-item .value {
    font-family: 'Inter', sans-serif !important;
    font-weight: 600 !important;
    color: #0d1b2a !important;
    font-size: clamp(0.8rem, 1.5vw, 0.9rem) !important;
    text-align: right;
}

/* ===== КНОПКА ЗАПИСИ ===== */
.btn-register {
    width: 100%;
    padding: clamp(12px, 2vw, 16px) 20px;
    border: none;
    border-radius: 8px;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(0.9rem, 1.5vw, 1rem) !important;
    letter-spacing: 0.03em !important;
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
    color: white !important;
    transition: all 0.3s ease !important;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.btn-register:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 4px 16px rgba(26, 79, 122, 0.25) !important;
}

.btn-register:active {
    transform: scale(0.97) !important;
}

.btn-register:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
}

.btn-register.registered {
    background: #10b981 !important;
}

.btn-register.registered:hover {
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25) !important;
}

/* ===== ИНФО БОКС ===== */
.info-box {
    margin-top: 16px;
    padding: clamp(12px, 2vw, 16px);
    background: rgba(26, 79, 122, 0.04);
    border-radius: 8px;
    border-left: 3px solid #1a4f7a;
}

.info-box p {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(0.8rem, 1.3vw, 0.85rem) !important;
    color: #4a5a6a !important;
    margin-bottom: 6px !important;
    font-weight: 500 !important;
    letter-spacing: 0.02em !important;
    word-wrap: break-word;
}

.info-box p:last-child {
    margin-bottom: 0 !important;
}

.info-box .info-icon {
    color: #1a4f7a;
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */
.profile-incomplete-modal .modal-content {
    border-radius: 16px;
    border: none;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
}

.profile-incomplete-modal .modal-header {
    border-bottom: 2px solid #1a4f7a;
    padding: clamp(16px, 2vw, 20px) clamp(16px, 3vw, 24px);
}

.profile-incomplete-modal .modal-title {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    color: #0d1b2a !important;
    font-size: clamp(1rem, 2vw, 1.2rem) !important;
}

.profile-incomplete-modal .modal-title i {
    color: #dc2626;
}

.profile-incomplete-modal .modal-body {
    padding: clamp(16px, 2vw, 24px);
}

.profile-incomplete-modal .modal-footer {
    border-top: 1px solid var(--border);
    padding: clamp(12px, 1.5vw, 16px) clamp(16px, 3vw, 24px);
    flex-wrap: wrap;
    gap: 8px;
}

.progress-status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.progress-text {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(0.8rem, 1.5vw, 0.9rem) !important;
    color: #0d1b2a !important;
    min-width: 40px;
}

.progress-bar-mini {
    flex: 1;
    height: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    overflow: hidden;
}

.progress-bar-mini .fill {
    height: 100%;
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%);
    border-radius: 3px;
    transition: width 0.3s ease;
}

.missing-sections-list {
    list-style: none;
    padding: 0;
    margin: 12px 0;
}

.missing-sections-list li {
    padding: clamp(8px, 1.2vw, 10px) clamp(10px, 1.5vw, 14px);
    margin-bottom: 8px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 8px;
    border-left: 3px solid #dc2626;
}

.section-label {
    display: block;
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(0.8rem, 1.5vw, 0.9rem) !important;
    color: #0d1b2a !important;
    margin-bottom: 4px;
}

.section-fields {
    display: inline-block;
    font-family: 'Inter', sans-serif !important;
    font-size: clamp(0.65rem, 1.2vw, 0.75rem) !important;
    color: #4a5a6a !important;
    background: rgba(26, 79, 122, 0.06);
    padding: 2px 10px;
    border-radius: 4px;
}

.field-item {
    display: inline-block;
    background: rgba(26, 79, 122, 0.04);
    padding: 0 8px;
    margin: 1px 2px;
    border-radius: 3px;
    font-size: 0.7rem;
    color: #1a4f7a;
}

.alert-info-custom {
    padding: clamp(10px, 1.5vw, 12px) clamp(12px, 2vw, 16px);
    background: rgba(26, 79, 122, 0.06);
    border-radius: 8px;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(0.8rem, 1.3vw, 0.9rem) !important;
    color: #4a5a6a !important;
    margin-top: 12px;
    font-weight: 500 !important;
    border: 1px solid rgba(26, 79, 122, 0.06);
}

.alert-info-custom i {
    color: #1a4f7a;
    margin-right: 8px;
}

.btn-close-modal {
    padding: clamp(6px, 1vw, 8px) clamp(16px, 2vw, 20px);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 600 !important;
    font-size: clamp(0.8rem, 1.3vw, 0.9rem) !important;
    color: #4a5a6a !important;
    transition: all 0.3s ease;
    cursor: pointer;
    touch-action: manipulation;
}

.btn-close-modal:hover {
    background: rgba(26, 79, 122, 0.04);
    border-color: #1a4f7a;
}

.btn-close-modal:active {
    transform: scale(0.97);
}

.btn-go-profile {
    padding: clamp(6px, 1vw, 8px) clamp(16px, 2vw, 24px);
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
    color: white !important;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(0.8rem, 1.3vw, 0.9rem) !important;
    transition: all 0.3s ease;
    cursor: pointer;
    touch-action: manipulation;
}

.btn-go-profile:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(26, 79, 122, 0.25);
}

.btn-go-profile:active {
    transform: scale(0.97);
}

/* ===== ЗАГРУЗКА ===== */
.loading-container {
    text-align: center;
    padding: 40px 20px;
}

.loading-container .spinner-border {
    color: var(--primary);
    width: clamp(2.5rem, 5vw, 3rem);
    height: clamp(2.5rem, 5vw, 3rem);
}

.loading-container p {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(1rem, 1.8vw, 1.1rem) !important;
    font-weight: 500 !important;
    color: #6c757d !important;
    margin-top: 16px !important;
}

/* ===== ОШИБКА ===== */
.error-container {
    text-align: center;
    padding: 40px 20px;
}

.error-container .bg-light {
    background: #f8f9fa !important;
    border-radius: 50% !important;
    display: inline-flex !important;
    padding: clamp(16px, 3vw, 24px) !important;
    margin-bottom: 24px !important;
}

.error-container .bg-light i {
    font-size: clamp(2rem, 5vw, 3rem) !important;
    color: #dc2626 !important;
}

.error-container h3 {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    color: #0d1b2a !important;
    font-size: clamp(1.3rem, 3vw, 1.8rem) !important;
    margin-bottom: 12px !important;
}

.error-container .text-muted {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: clamp(0.95rem, 2vw, 1.1rem) !important;
    margin-bottom: 20px !important;
}

.error-container .btn {
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
    color: white !important;
    border: none !important;
    border-radius: 8px !important;
    padding: clamp(8px, 1.5vw, 10px) clamp(20px, 3vw, 28px) !important;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: clamp(0.9rem, 1.5vw, 1rem) !important;
    letter-spacing: 0.03em !important;
}

/* ===== ТЕГИ НА МОБИЛЬНЫХ ===== */
.tags-container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
}

/* ===== АДАПТИВ ===== */
@media (max-width: 991.98px) {
    .sticky-sidebar {
        position: relative;
        top: 0;
    }
    
    .course-page .card-body {
        padding: 20px !important;
    }
}

@media (max-width: 767.98px) {
    .course-hero-image,
    .course-placeholder {
        height: 200px;
    }
    
    .course-page .card-body {
        padding: 16px !important;
    }
    
    .course-page .card {
        border-radius: 12px !important;
    }
    
    .btn-outline-favorite,
    .btn-outline-watch {
        flex: 1 1 45%;
        justify-content: center;
        text-align: center;
        padding: 8px 12px;
        font-size: 0.8rem;
    }
    
    .btn-group-responsive {
        flex-direction: row;
        flex-wrap: wrap;
    }
    
    .course-info-card {
        padding: 16px;
    }
    
    .course-info-item {
        padding: 6px 0;
    }
    
    .section-title {
        font-size: 1rem !important;
    }
    
    .speaker-img {
        width: 64px;
        height: 64px;
    }
    
    .speaker-card {
        padding: 12px;
    }
    
    .missing-sections-list li {
        padding: 8px 12px;
    }
    
    .profile-incomplete-modal .modal-footer {
        flex-direction: column;
    }
    
    .profile-incomplete-modal .modal-footer .btn-close-modal,
    .profile-incomplete-modal .modal-footer .btn-go-profile {
        width: 100%;
        justify-content: center;
    }
}

@media (max-width: 575.98px) {
    .course-hero-image,
    .course-placeholder {
        height: 160px;
    }
    
    .course-page .card-body {
        padding: 14px !important;
    }
    
    .course-page h1 {
        font-size: clamp(1.3rem, 5vw, 1.6rem) !important;
    }
    
    .btn-outline-favorite,
    .btn-outline-watch {
        flex: 1 1 100%;

    .course-info-item .value {

}

@media (max-width: 400px) {

/* ===== УЛУЧШЕНИЯ ДЛЯ ТАЧ-УСТРОЙСТВ ===== */

{% endblock %}

{% block content %}
<div class="container py-3 py-md-4" id="courseContainer">
    <div class="loading-container">
        <div class="spinner-border" style="color: var(--primary);" role="status"></div>
        <p>Загрузка курса...</p>
    </div>
</div>

<script>
    const courseId = {{ course_id }};
    let courseData = null;
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    const formatMap = {
        'full_time': 'Очный',
        'part_time': 'Заочный',
        'full_part_time': 'Очно-заочный',
        'online': 'Онлайн'
    };
    
    const formatBadgeClass = {
        'online': 'badge-format-online',
        'full_time': 'badge-format-full_time',
        'part_time': 'badge-format-part_time',
        'full_part_time': 'badge-format-full_part_time'
    };
    
    async function loadCourse() {
        const token = localStorage.getItem('token');
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        
        try {
            const response = await fetch(`/api/courses/${courseId}`, { headers });
            
            if (!response.ok) {
                throw new Error('Курс не найден');
            }
            
            courseData = await response.json();
            renderCourse(courseData);
            
        } catch (error) {
            console.error('Error loading course:', error);
            document.getElementById('courseContainer').innerHTML = `
                <div class="error-container">
                    <div class="bg-light rounded-circle d-inline-flex p-4">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <h3>Курс не найден</h3>
                    <p class="text-muted">Запрашиваемый курс не существует или был удалён</p>
                    <a href="/courses" class="btn">
                        <i class="bi bi-arrow-left me-2"></i>Вернуться к курсам
                    </a>
                </div>
            `;
        }
    }
    
    function renderCourse(course) {
        const container = document.getElementById('courseContainer');
        const courseFormat = formatMap[course.format_type] || 'Онлайн';
        const formatBadge = formatBadgeClass[course.format_type] || 'badge-format-online';
        
        const token = localStorage.getItem('token');
        const isAuthenticated = !!token;
        const isRegistered = course.is_registered || false;
        
        // ========== MOODLE БЛОК ==========
        let moodleHtml = '';
        if (course.moodle_course_id) {
            moodleHtml = `
                <div class="moodle-badge">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span>Курс привязан к Moodle (ID: ${course.moodle_course_id})</span>
                </div>
            `;
        }
        
        // ========== СПИКЕРЫ ==========
        let speakersHtml = '';
        if (course.speakers && course.speakers.length > 0) {
            speakersHtml = `
                <div class="card border-0 shadow-sm mb-4" style="border-radius: 16px; border: 1px solid var(--border);">
                    <div class="card-header bg-white border-0 pt-3 pt-md-4 pb-0" style="border-radius: 16px 16px 0 0;">
                        <h4 class="mb-0 fw-bold" style="color: #0d1b2a; font-family: 'Playfair Display', serif; font-size: clamp(1rem, 2vw, 1.2rem);">
                            <i class="bi bi-people-fill me-2" style="color: #1a4f7a;"></i>
                            Эксперты курса
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row g-3 g-md-4">
            `;
            course.speakers.forEach(speaker => {
                speakersHtml += `
                    <div class="col-6 col-md-4 col-lg-4">
                        <div class="speaker-card">
                            <img src="${speaker.photo_url || 'https://ui-avatars.com/api/?background=1a4f7a&color=fff&rounded=true&size=100&bold=true&name=' + encodeURIComponent(speaker.full_name.split(' ')[0])}" 
                                 class="speaker-img" 
                                 alt="${escapeHtml(speaker.full_name)}"
                                 loading="lazy">
                            <div class="speaker-name">${escapeHtml(speaker.full_name)}</div>
                            <div class="speaker-position">${escapeHtml(speaker.position || 'Эксперт')}</div>
                            ${speaker.bio ? `<div class="speaker-bio">${escapeHtml(speaker.bio.length > 80 ? speaker.bio.substring(0, 80) + '...' : speaker.bio)}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            speakersHtml += `
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ========== ОСНОВНОЙ HTML ==========
        const html = `
            <div class="row g-3 g-md-4 course-page">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm mb-4" style="border-radius: 16px; border: 1px solid var(--border); overflow: hidden;">
                        ${course.image_url ? 
                            `<img src="${course.image_url}" class="course-hero-image" alt="${escapeHtml(course.title)}" loading="lazy">` : 
                            `<div class="course-placeholder">
                                <i class="bi bi-book"></i>
                                <p class="text-muted mt-2" style="font-family: 'Cormorant Garamond', serif; font-size: clamp(0.8rem, 1.5vw, 1rem);">Изображение отсутствует</p>
                            </div>`
                        }
                        <div class="card-body p-3 p-md-4">
                            ${moodleHtml}
                            
                            <h1 class="fw-bold mb-3" style="color: #0d1b2a; font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(1.4rem, 4vw, 2.2rem);">${escapeHtml(course.title)}</h1>
                            
                            <div class="btn-group-responsive mb-4">
                                <button class="btn-outline-favorite ${course.is_favorite ? 'active' : ''}" id="favoriteBtn" onclick="toggleFavorite()" ${!isAuthenticated ? 'disabled' : ''}>
                                    <i class="bi bi-heart${course.is_favorite ? '-fill' : ''} me-1"></i> ${course.is_favorite ? 'В избранном' : 'Избранное'}
                                </button>
                                <button class="btn-outline-watch ${course.is_watch_later ? 'active' : ''}" id="watchLaterBtn" onclick="toggleWatchLater()" ${!isAuthenticated ? 'disabled' : ''}>
                                    <i class="bi bi-clock${course.is_watch_later ? '-fill' : ''} me-1"></i> ${course.is_watch_later ? 'В списке' : 'Посмотреть позже'}
                                </button>
                            </div>
                            
                            <div class="tags-container mb-4">
                                <span class="badge-category me-2 mb-1">${escapeHtml(course.category_name || 'Без категории')}</span>
                                <span class="badge-format ${formatBadge} me-2 mb-1">${courseFormat}</span>
                                ${course.hashtags ? course.hashtags.split(' ').map(tag => 
                                    `<span class="badge-hashtag mb-1">${escapeHtml(tag)}</span>`
                                ).join('') : ''}
                            </div>
                            
                            <h5 class="section-title"><i class="bi bi-info-circle"></i>Описание курса</h5>
                            <div class="course-description">${escapeHtml(course.description || 'Нет описания')}</div>
                            
                            ${course.video_url ? `
                                <div class="mt-4">
                                    <h5 class="section-title"><i class="bi bi-play-circle-fill"></i>Видео-презентация</h5>
                                    <div class="video-wrapper">
                                        <iframe src="${course.video_url.replace('watch?v=', 'embed/').replace('youtu.be/', 'www.youtube.com/embed/')}" 
                                                allowfullscreen
                                                loading="lazy"></iframe>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    ${speakersHtml}
                </div>
                
                <div class="col-lg-4">
                    <div class="sticky-sidebar">
                        <div class="course-info-card">
                            <div class="text-center mb-4">
                                <div style="font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 700; color: #1a4f7a; font-family: 'Playfair Display', serif;">${course.current_participants || 0}</div>
                                <span class="text-muted" style="font-family: 'Cormorant Garamond', serif; font-size: clamp(0.85rem, 1.5vw, 0.95rem);">из ${course.max_participants || 0} мест занято</span>
                            </div>
                            
                            <hr>
                            
                            <div class="course-info-item">
                                <span class="label"><i class="bi bi-calendar3 me-2"></i>Начало</span>
                                <span class="value">${course.start_date ? new Date(course.start_date).toLocaleDateString() : 'Скоро'}</span>
                            </div>
                            <div class="course-info-item">
                                <span class="label"><i class="bi bi-calendar-check me-2"></i>Окончание</span>
                                <span class="value">${course.end_date ? new Date(course.end_date).toLocaleDateString() : 'По набору'}</span>
                            </div>
                            <div class="course-info-item">
                                <span class="label"><i class="bi bi-person-badge me-2"></i>Формат</span>
                                <span class="value">${courseFormat}</span>
                            </div>
                            ${course.moodle_course_id ? `
                                <div class="course-info-item">
                                    <span class="label"><i class="bi bi-box-arrow-up-right me-2"></i>Moodle</span>
                                    <span class="value" style="color: #1a4f7a;">ID: ${course.moodle_course_id}</span>
                                </div>
                            ` : ''}
                            
                            <hr>
                            
                            <button class="btn-register ${isRegistered ? 'registered' : ''}" id="registerBtn" onclick="handleRegistration()" ${!isAuthenticated ? 'disabled' : ''}>
                                ${isRegistered ? '<i class="bi bi-check-circle me-2"></i>Вы записаны' : '<i class="bi bi-pencil-square me-2"></i>Записаться на курс'}
                            </button>
                            
                            <div class="info-box">
                                <p><i class="bi bi-info-circle info-icon me-1"></i> После успешной записи вы получите уведомление на email.</p>
                                <p><i class="bi bi-folder info-icon me-1"></i> Все материалы курса будут доступны в личном кабинете Moodle.</p>
                                <p><i class="bi bi-folder info-icon me-1"></i> Чтобы перейти в Moodle - перейдите в ваш Кабинет (Раздел-Мои курсы).</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
    }
    
    // ========== ТОГГЛЫ ИЗБРАННОГО И ПОСМОТРЕТЬ ПОЗЖЕ ==========
    
    async function toggleFavorite() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.showToast) window.showToast('Войдите в систему', 'danger');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }
        
        const btn = document.getElementById('favoriteBtn');
        const isActive = btn.classList.contains('active');
        
        try {
            const response = await fetch(`/api/courses/${courseId}/favorite`, {
                method: isActive ? 'DELETE' : 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (response.ok) {
                if (isActive) {
                    btn.classList.remove('active');
                    btn.innerHTML = '<i class="bi bi-heart me-1"></i> Избранное';
                    if (window.showToast) window.showToast('Удалено из избранного', 'success');
                } else {
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="bi bi-heart-fill me-1"></i> В избранном';
                    if (window.showToast) window.showToast('Добавлено в избранное', 'success');
                }
            }
        } catch (error) {
            console.error('Error toggling favorite:', error);
            if (window.showToast) window.showToast('Ошибка при выполнении действия', 'danger');
        }
    }
    
    async function toggleWatchLater() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.showToast) window.showToast('Войдите в систему', 'danger');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }
        
        const btn = document.getElementById('watchLaterBtn');
        const isActive = btn.classList.contains('active');
        
        try {
            const response = await fetch(`/api/courses/${courseId}/watch-later`, {
                method: isActive ? 'DELETE' : 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (response.ok) {
                if (isActive) {
                    btn.classList.remove('active');
                    btn.innerHTML = '<i class="bi bi-clock me-1"></i> Посмотреть позже';
                    if (window.showToast) window.showToast('Удалено из "Посмотреть позже"', 'success');
                } else {
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="bi bi-clock-fill me-1"></i> В списке';
                    if (window.showToast) window.showToast('Добавлено в "Посмотреть позже"', 'success');
                }
            }
        } catch (error) {
            console.error('Error toggling watch later:', error);
            if (window.showToast) window.showToast('Ошибка при выполнении действия', 'danger');
        }
    }
    
    // ========== РЕГИСТРАЦИЯ НА КУРС ==========
    
    async function handleRegistration() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.showToast) window.showToast('Войдите в систему, чтобы записаться на курс', 'danger');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }
        
        const btn = document.getElementById('registerBtn');
        if (btn.classList.contains('registered')) {
            if (window.showToast) window.showToast('Вы уже записаны на этот курс', 'info');
            return;
        }
        
        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Проверка...';
        
        try {
            // Проверяем возможность записи
            const checkResponse = await fetch(`/api/courses/${courseId}/check-registration-eligibility`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (checkResponse.ok) {
                const checkResult = await checkResponse.json();
                
                if (!checkResult.eligible) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    
                    if (checkResult.reason === 'profile_incomplete') {
                        showProfileIncompleteModal(checkResult.missing_sections, checkResult.redirect);
                    } else if (checkResult.reason === 'already_registered') {
                        btn.classList.add('registered');
                        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Вы записаны';
                        if (window.showToast) window.showToast('Вы уже записаны на этот курс', 'info');
                    } else if (checkResult.reason === 'course_full') {
                        if (window.showToast) window.showToast('Курс полностью заполнен', 'danger');
                    } else {
                        if (window.showToast) window.showToast(checkResult.message || 'Невозможно записаться', 'warning');
                    }
                    return;
                }
            }
            
            // Регистрация
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Запись...';
            
            const regResponse = await fetch(`/api/courses/${courseId}/register`, {
                method: 'POST',
                headers: { 
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            });
            
            if (regResponse.ok) {
                const result = await regResponse.json();
                btn.classList.add('registered');
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Вы записаны';
                if (window.showToast) window.showToast(result.message || 'Вы успешно записаны на курс!', 'success');
                
                if (result.moodle_course_url) {
                    setTimeout(() => {
                        if (window.showToast) window.showToast('Курс также доступен в Moodle!', 'info');
                    }, 1000);
                }
            } else if (regResponse.status === 403) {
                const error = await regResponse.json();
                if (error.detail && typeof error.detail === 'object' && error.detail.code === 'profile_incomplete') {
                    showProfileIncompleteModal(error.detail.missing_sections, error.detail.redirect);
                } else {
                    if (window.showToast) window.showToast(error.detail || 'Ошибка записи на курс', 'danger');
                }
                btn.disabled = false;
                btn.innerHTML = originalText;
            } else {
                const error = await regResponse.json();
                if (window.showToast) window.showToast(error.detail || 'Ошибка записи на курс', 'danger');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        } catch (error) {
            console.error('Registration error:', error);
            if (window.showToast) window.showToast('Ошибка соединения с сервером', 'danger');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    
    // ========== МОДАЛЬНОЕ ОКНО ДЛЯ НЕЗАПОЛНЕННОГО ПРОФИЛЯ ==========
    
    function showProfileIncompleteModal(missingSections, redirectUrl) {
        const existingModal = document.getElementById('profileIncompleteModal');
        if (existingModal) {
            const modal = bootstrap.Modal.getInstance(existingModal);
            if (modal) modal.hide();
            existingModal.remove();
        }
        
        let totalSections = 0;
        let completedSections = 0;
        let sectionsHtml = '';
        
        if (missingSections && Array.isArray(missingSections)) {
            totalSections = missingSections.length;
            completedSections = missingSections.filter(s => s.is_complete).length;
            
            const incompleteSections = missingSections.filter(s => !s.is_complete);
            
            if (incompleteSections.length > 0) {
                sectionsHtml = incompleteSections.map(section => {
                    const fieldsHtml = section.fields && section.fields.length > 0 
                        ? section.fields.map(f => `<span class="field-item">${escapeHtml(f)}</span>`).join('')
                        : '';
                    
                    return `
                        <li>
                            <span class="section-label">${escapeHtml(section.label)}</span>
                            ${fieldsHtml ? `<span class="section-fields">${fieldsHtml}</span>` : ''}
                        </li>
                    `;
                }).join('');
            }
        }
        
        if (!sectionsHtml) {
            sectionsHtml = `
                <li>
                    <span class="section-label">Необходимо заполнить все разделы профиля</span>
                    <span class="section-fields">Личные данные, Образование, Работа, Документы</span>
                </li>
            `;
        }
        
        const progressPercent = totalSections > 0 ? Math.round((completedSections / totalSections) * 100) : 0;
        
        const modalHtml = `
            <div class="modal fade profile-incomplete-modal" id="profileIncompleteModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
                <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                Профиль не заполнен
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="text-center mb-3">
                                <i class="bi bi-person-x fs-1" style="color: #dc2626;"></i>
                            </div>
                            
                            <div class="progress-status">
                                <span class="progress-text">${progressPercent}%</span>
                                <div class="progress-bar-mini">
                                    <div class="fill" style="width: ${progressPercent}%"></div>
                                </div>
                                <span class="progress-text" style="font-weight: 400; color: #718096; font-size: clamp(0.65rem, 1.2vw, 0.75rem);">
                                    ${completedSections}/${totalSections}
                                </span>
                            </div>
                            
                            <p style="font-weight: 500; color: #0d1b2a; font-family: 'Cormorant Garamond', serif; font-size: clamp(0.9rem, 1.5vw, 1rem);">
                                Для записи на курсы необходимо заполнить все разделы профиля:
                            </p>
                            <ul class="missing-sections-list">
                                ${sectionsHtml}
                            </ul>
                            <div class="alert-info-custom">
                                <i class="bi bi-info-circle"></i>
                                После заполнения всех разделов вы сможете записаться на курсы.
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-close-modal" data-bs-dismiss="modal">
                                Закрыть
                            </button>
                            <button class="btn-go-profile" onclick="redirectToProfile('${redirectUrl || '/profile'}')">
                                <i class="bi bi-person-badge me-2"></i>
                                Перейти в Мои данные
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const modalElement = document.getElementById('profileIncompleteModal');
        const modal = new bootstrap.Modal(modalElement, {
            backdrop: 'static',
            keyboard: false
        });
        modal.show();
    }
    
    function redirectToProfile(url) {
        const modalElement = document.getElementById('profileIncompleteModal');
        if (modalElement) {
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) modal.hide();
        }
        setTimeout(() => {
            window.location.href = url;
        }, 300);
    }
    
    loadCourse();
</script>
{% endblock %}
