{% extends "base.html" %}

{% block title %}Мои курсы - ИРО ЧР{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="text-center mb-4">
        <h1 class="fw-bold">Мои курсы</h1>
        <p class="text-muted">Курсы, на которые вы записаны</p>
    </div>
    
    <div id="registrationsList">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3">Загрузка...</p>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    async function loadRegistrations() {
        const response = await fetch('/api/courses/my/registrations', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await response.json();
        
        const container = document.getElementById('registrationsList');
        
        if (data.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted"></i>
                    <p class="mt-3">Вы не записаны ни на один курс</p>
                    <a href="/courses" class="btn btn-primary">Смотреть курсы</a>
                </div>
            `;
        } else {
            let html = '<div class="row g-4">';
            data.forEach(course => {
                html += `
                    <div class="col-md-6">
                        <div class="card shadow-lg border-0">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title mb-0">${escapeHtml(course.course_title)}</h5>
                                </div>
                                <p class="text-muted small mt-2">
                                    <i class="bi bi-calendar"></i> Записан: ${new Date(course.registered_at).toLocaleDateString()}
                                </p>
                                <a href="/course/${course.course_id}" class="btn btn-primary btn-sm mt-2">
                                    Подробнее <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }
    }
    
    loadRegistrations();
</script>
{% endblock %}
