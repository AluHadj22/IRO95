{% extends "base.html" %}

{% block title %}Курсы - ИРО ЧР{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold">Все курсы</h1>
        <p class="text-muted">Выберите программу повышения квалификации</p>
    </div>
    
    <div class="row g-4" id="coursesList">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3">Загрузка курсов...</p>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    
    function formatPrice(price) {
        if (price === 0) return 'Бесплатно';
        return price.toLocaleString() + ' ₽';
    }
    
    async function loadCourses() {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        
        try {
            const response = await fetch('/api/courses/', { headers });
            
            if (!response.ok) {
                throw new Error('Ошибка загрузки');
            }
            
            const courses = await response.json();
            const container = document.getElementById('coursesList');
            
            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-inbox fs-1 text-muted"></i>
                        <p class="mt-3">Курсы пока не добавлены</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            courses.forEach(course => {
                html += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100">
                            ${course.image_url ? 
                                `<img src="${course.image_url}" class="course-card-img" alt="${course.title}">` :
                                `<div class="course-card-img bg-secondary d-flex align-items-center justify-content-center">
                                    <i class="bi bi-camera fs-1 text-white"></i>
                                </div>`
                            }
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-primary">${course.category_name || "Обучение"}</span>
                                    <span class="fw-bold text-primary">${formatPrice(course.price)}</span>
                                </div>
                                <h5 class="card-title">${escapeHtml(course.title)}</h5>
                                <p class="card-text text-muted small">${escapeHtml(course.short_description ? course.short_description.substring(0, 80) : (course.description ? course.description.substring(0, 80) : "Описание курса"))}...</p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <small class="text-muted"><i class="bi bi-people"></i> ${course.current_participants}/${course.max_participants}</small>
                                    <a href="/course/${course.id}" class="btn btn-primary btn-sm">Подробнее <i class="bi bi-arrow-right"></i></a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        } catch (error) {
            console.error('Error loading courses:', error);
            document.getElementById('coursesList').innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
                    <p class="mt-3">Ошибка загрузки курсов. Пожалуйста, попробуйте позже.</p>
                </div>
            `;
        }
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    loadCourses();
</script>
{% endblock %}
