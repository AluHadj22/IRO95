{% extends "base.html" %}

{% block title %}Курсы - ГБУ ДПО «ИРО ЧР»{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/courses.css">
{% endblock %}

{% block content %}
<!-- Герой-секция -->
<div class="courses-hero">
    <div class="container text-center">
        <div class="hero-badge">Система дистанционного обучения</div>
        <h1 class="fw-bold">
            <span class="gold">Все</span> курсы
        </h1>
        <p class="lead mb-0">Выберите программу повышения квалификации</p>
    </div>
</div>

<div class="container mt-4 mb-5">
    <div class="row g-4">
        <!-- Фильтры - боковая панель -->
        <div class="col-lg-3">
            <div class="filter-sidebar">
                <h5 class="filter-title"><i class="bi bi-funnel me-2"></i>Фильтры</h5>
                
                <!-- Поиск -->
                <div class="filter-group">
                    <label><i class="bi bi-search me-1"></i>Поиск</label>
                    <div class="search-input">
                        <i class="bi bi-search"></i>
                        <input type="text" class="form-control" id="searchInput" placeholder="Название курса...">
                    </div>
                </div>
                
                <!-- Категории -->
                <div class="filter-group">
                    <label><i class="bi bi-folder me-1"></i>Категории</label>
                    <div id="categoriesList"></div>
                </div>
                
                <!-- Формат обучения -->
                <div class="filter-group">
                    <label><i class="bi bi-calendar-event me-1"></i>Формат обучения</label>
                    <div class="filter-check">
                        <input type="checkbox" id="formatOnline">
                        <label for="formatOnline">Онлайн</label>
                    </div>
                    <div class="filter-check">
                        <input type="checkbox" id="formatFullTime">
                        <label for="formatFullTime">Очный</label>
                    </div>
                    <div class="filter-check">
                        <input type="checkbox" id="formatPartTime">
                        <label for="formatPartTime">Заочный</label>
                    </div>
                    <div class="filter-check">
                        <input type="checkbox" id="formatFullPartTime">
                        <label for="formatFullPartTime">Очно-заочный</label>
                    </div>
                </div>
                
                <!-- Кнопка сброса фильтров -->
                <button class="clear-filters" onclick="resetFilters()">
                    <i class="bi bi-arrow-clockwise me-2"></i>Сбросить фильтры
                </button>
            </div>
        </div>
        
        <!-- Список курсов -->
        <div class="col-lg-9">
            <div id="resultCount" class="result-count">
                <i class="bi bi-grid-3x3-gap-fill me-2" style="color: var(--primary);"></i>
                <span id="coursesCount">Загрузка...</span>
            </div>
            <div class="row g-4" id="coursesList">
                <div class="text-center py-5">
                    <div class="loading-spinner"></div>
                    <p class="mt-3 text-muted">Загрузка курсов...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    let allCourses = [];
    let allCategories = [];
    let filteredCount = 0;
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    const formatMap = {
        'full_time': 'Очный',
        'part_time': 'Заочный',
        'full_part_time': 'Очно-заочный',
        'online': 'Онлайн'
    };
    
    const formatBadgeClass = {
        'online': 'badge-format-online',
        'full_time': 'badge-format-full_time',
        'part_time': 'badge-format-part_time',
        'full_part_time': 'badge-format-full_part_time'
    };
    
    async function loadCategories() {
        try {
            const response = await fetch('/api/admin/categories', {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            if (response.ok) {
                allCategories = await response.json();
                renderCategoriesFilter();
            }
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }
    
    function renderCategoriesFilter() {
        const container = document.getElementById('categoriesList');
        if (!container) return;
        
        if (allCategories.length === 0) {
            container.innerHTML = '<p class="text-muted small">Нет категорий</p>';
            return;
        }
        
        let html = '';
        allCategories.forEach(cat => {
            const count = cat.courses_count || 0;
            html += `
                <div class="category-check">
                    <input type="checkbox" class="category-checkbox" id="cat_${cat.id}" value="${cat.id}">
                    <label for="cat_${cat.id}">${escapeHtml(cat.name)}</label>
                    <span class="count-badge">${count}</span>
                </div>
            `;
        });
        container.innerHTML = html;
        
        document.querySelectorAll('.category-checkbox').forEach(cb => {
            cb.addEventListener('change', filterCourses);
        });
    }
    
    function getSelectedCategories() {
        const selected = [];
        document.querySelectorAll('.category-checkbox:checked').forEach(cb => {
            selected.push(parseInt(cb.value));
        });
        return selected;
    }
    
    function getSelectedFormats() {
        const formats = [];
        if (document.getElementById('formatOnline')?.checked) formats.push('online');
        if (document.getElementById('formatFullTime')?.checked) formats.push('full_time');
        if (document.getElementById('formatPartTime')?.checked) formats.push('part_time');
        if (document.getElementById('formatFullPartTime')?.checked) formats.push('full_part_time');
        return formats;
    }
    
    function filterCourses() {
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const selectedCategories = getSelectedCategories();
        const selectedFormats = getSelectedFormats();
        
        let filtered = [...allCourses];
        
        if (searchTerm) {
            filtered = filtered.filter(course => 
                course.title.toLowerCase().includes(searchTerm) || 
                (course.description && course.description.toLowerCase().includes(searchTerm)) ||
                (course.short_description && course.short_description.toLowerCase().includes(searchTerm))
            );
        }
        
        if (selectedCategories.length > 0) {
            filtered = filtered.filter(course => 
                course.category_id && selectedCategories.includes(course.category_id)
            );
        }
        
        if (selectedFormats.length > 0) {
            filtered = filtered.filter(course => 
                course.format_type && selectedFormats.includes(course.format_type)
            );
        }
        
        filteredCount = filtered.length;
        renderCourses(filtered);
        updateResultCount();
    }
    
    function updateResultCount() {
        const countEl = document.getElementById('coursesCount');
        if (countEl) {
            countEl.innerHTML = `<strong>${filteredCount}</strong> ${filteredCount === 1 ? 'курс' : (filteredCount < 5 ? 'курса' : 'курсов')}`;
        }
    }
    
    async function loadCourses() {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        
        try {
            const response = await fetch('/api/courses/', { headers });
            
            if (!response.ok) {
                throw new Error('Ошибка загрузки');
            }
            
            allCourses = await response.json();
            filterCourses();
            
        } catch (error) {
            console.error('Error loading courses:', error);
            document.getElementById('coursesList').innerHTML = `
                <div class="no-results">
                    <i class="bi bi-exclamation-triangle" style="color: #dc2626;"></i>
                    <h5>Ошибка загрузки</h5>
                    <p>Не удалось загрузить курсы. Пожалуйста, попробуйте позже.</p>
                    <button class="btn btn-primary" onclick="loadCourses()">
                        <i class="bi bi-arrow-repeat me-2"></i>Повторить
                    </button>
                </div>
            `;
            document.getElementById('coursesCount').textContent = 'Ошибка';
        }
    }
    
    function renderCourses(courses) {
        const container = document.getElementById('coursesList');
        
        if (!courses || courses.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="bi bi-inbox"></i>
                    <h5>Курсы не найдены</h5>
                    <p>Попробуйте изменить параметры поиска или фильтры</p>
                    <button class="btn btn-primary" onclick="resetFilters()">Сбросить фильтры</button>
                </div>
            `;
            return;
        }
        
        let html = '';
        courses.forEach(course => {
            const formatText = formatMap[course.format_type] || 'Онлайн';
            const badgeClass = formatBadgeClass[course.format_type] || 'badge-format-online';
            const categoryName = course.category_name || 'Обучение';
            
            html += `
                <div class="col-md-6 col-lg-4">
                    <div class="course-card">
                        <div class="format-badge">
                            <span class="badge ${badgeClass}">${formatText}</span>
                        </div>
                        <div class="course-badge">
                            <span class="badge">${escapeHtml(categoryName)}</span>
                        </div>
                        ${course.image_url ? 
                            `<img src="${course.image_url}" class="course-card-img" alt="${escapeHtml(course.title)}" loading="lazy">` :
                            `<div class="course-card-img d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #fef9e7 0%, #fdf2d0 100%);">
                                <i class="bi bi-book" style="font-size: 3rem; color: var(--primary);"></i>
                            </div>`
                        }
                        <div class="card-body">
                            <h5 class="card-title">${escapeHtml(course.title)}</h5>
                            <p class="card-text">${escapeHtml(course.short_description ? course.short_description.substring(0, 80) : (course.description ? course.description.substring(0, 80) : "Описание курса"))}...</p>
                            <div class="course-meta">
                                <span class="participants">
                                    <i class="bi bi-people"></i> ${course.current_participants || 0}/${course.max_participants || 0}
                                </span>
                                <a href="/course/${course.id}" class="btn-course">
                                    Подробнее <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    function resetFilters() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        
        document.querySelectorAll('.category-checkbox').forEach(cb => {
            cb.checked = false;
        });
        
        document.getElementById('formatOnline') && (document.getElementById('formatOnline').checked = false);
        document.getElementById('formatFullTime') && (document.getElementById('formatFullTime').checked = false);
        document.getElementById('formatPartTime') && (document.getElementById('formatPartTime').checked = false);
        document.getElementById('formatFullPartTime') && (document.getElementById('formatFullPartTime').checked = false);
        
        filterCourses();
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', filterCourses);
        }
        
        const formats = ['formatOnline', 'formatFullTime', 'formatPartTime', 'formatFullPartTime'];
        formats.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('change', filterCourses);
        });
    });
    
    loadCategories();
    loadCourses();
</script>
{% endblock %}
