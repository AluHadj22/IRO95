{% extends "base.html" %}

{% block title %}Регистрация - ИРО ЧР{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-gradient text-white text-center border-0">
                    <h3 class="mb-0"><i class="bi bi-person-plus"></i> Регистрация</h3>
                </div>
                <div class="card-body p-4">
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold"><i class="bi bi-person"></i> ФИО *</label>
                                <input type="text" class="form-control" id="full_name" placeholder="Иванов Иван Иванович" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold"><i class="bi bi-envelope"></i> Email *</label>
                                <input type="email" class="form-control" id="email" placeholder="example@mail.ru" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold"><i class="bi bi-briefcase"></i> Должность</label>
                                <input type="text" class="form-control" id="position" placeholder="Учитель">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold"><i class="bi bi-phone"></i> Телефон</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+7 (999) 123-45-67">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="bi bi-building"></i> Организация</label>
                            <input type="text" class="form-control" id="organization" placeholder="Школа №1">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold"><i class="bi bi-lock"></i> Пароль *</label>
                                <input type="password" class="form-control" id="password" placeholder="минимум 6 символов" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold"><i class="bi bi-shield-lock"></i> Подтверждение *</label>
                                <input type="password" class="form-control" id="confirm" placeholder="повторите пароль" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="bi bi-key"></i> Код администратора</label>
                            <input type="password" class="form-control" id="admin_code" placeholder="Оставьте пустым для обычного пользователя">
                            <small class="text-muted">Введите код <strong>adminIRO3377</strong> для получения прав администратора</small>
                        </div>
                        <button type="submit" class="btn btn-gradient w-100 btn-lg">Зарегистрироваться</button>
                    </form>
                    <div class="mt-4 text-center">
                        <p class="text-muted">Уже есть аккаунт? <a href="/login" class="text-primary">Войдите</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    
    if (password !== confirm) {
        showToast('Пароли не совпадают', 'danger');
        return;
    }
    
    if (password.length < 6) {
        showToast('Пароль должен быть не менее 6 символов', 'danger');
        return;
    }
    
    const data = {
        email: document.getElementById('email').value,
        full_name: document.getElementById('full_name').value,
        position: document.getElementById('position').value || null,
        phone: document.getElementById('phone').value || null,
        organization: document.getElementById('organization').value || null,
        password: password,
        admin_code: document.getElementById('admin_code').value || null
    };
    
    const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    if (response.ok) {
        const result = await response.json();
        showToast(result.role === 'admin' ? 'Вы зарегистрированы как АДМИНИСТРАТОР!' : 'Регистрация успешна!', 'success');
        setTimeout(() => window.location.href = '/login', 1500);
    } else {
        const error = await response.json();
        showToast(error.detail || 'Ошибка регистрации', 'danger');
    }
});
</script>
{% endblock %}
