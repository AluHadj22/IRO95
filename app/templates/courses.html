{% extends "base.html" %}

{% block title %}Курсы - ГБУ ДПО «ИРО ЧР»{% endblock %}

{% block extra_css %}
<style>
/* ===== ПЕРЕОПРЕДЕЛЕНИЕ ВСЕХ ЦВЕТОВ ===== */
:root {
    --primary: #1a4f7a !important;
    --primary-dark: #0d3b5e !important;
    --primary-light: #3a7ca5 !important;
    --primary-gradient: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
    --dark: #0d1b2a !important;
    --light: #f7fafc !important;
    --gray: #718096 !important;
    --white: #ffffff !important;
    --border: #e2e8f0 !important;
}

/* ===== ПЕРЕОПРЕДЕЛЕНИЕ BOOTSTRAP ===== */
.btn-primary,
.btn-primary:hover,
.btn-primary:focus,
.btn-primary:active,
.btn-primary:disabled {
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
    border-color: #1a4f7a !important;
    color: white !important;
}

.btn-outline-primary {
    border-color: #1a4f7a !important;
    color: #1a4f7a !important;
}

.btn-outline-primary:hover {
    background: #1a4f7a !important;
    color: white !important;
}

.bg-primary {
    background: #1a4f7a !important;
}

.text-primary {
    color: #1a4f7a !important;
}

.badge.bg-primary {
    background: linear-gradient(135deg, #1a4f7a 0%, #0d3b5e 100%) !important;
}

/* ===== ГЕРОЙ-СЕКЦИЯ ===== */
.courses-hero {
    background: linear-gradient(160deg, #e8edf3 0%, #d5dfea 50%, #e0e8f0 100%) !important;
    padding: 60px 0 50px !important;
    margin-bottom: 30px !important;
    position: relative !important;
    overflow: hidden !important;
    border-bottom: 2px solid rgba(26, 79, 122, 0.08) !important;
}

.courses-hero::before {
    content: '' !important;
    position: absolute !important;
    top: -30% !important;
    right: -10% !important;
    width: 500px !important;
    height: 500px !important;
    background: radial-gradient(circle, rgba(26, 79, 122, 0.04) 0%, transparent 70%) !important;
    border-radius: 50% !important;
    animation: floatHero 20s ease-in-out infinite !important;
}

.courses-hero::after {
    content: '' !important;
    position: absolute !important;
    bottom: -20% !important;
    left: -5% !important;
    width: 400px !important;
    height: 400px !important;
    background: radial-gradient(circle, rgba(26, 79, 122, 0.03) 0%, transparent 70%) !important;
    border-radius: 50% !important;
    animation: floatHero 15s ease-in-out infinite reverse !important;
}

@keyframes floatHero {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -20px) scale(1.05); }
}

.courses-hero h1 {
    color: #0d1b2a !important;
    position: relative !important;
    z-index: 1 !important;
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: 3.2rem !important;
    letter-spacing: 0.02em !important;
}

.courses-hero h1 .accent {
    font-family: 'Playfair Display', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-style: italic !important;
    color: #1a4f7a !important;
    letter-spacing: 0.03em !important;
}

.courses-hero p {
    color: #1a2a3a !important;
    opacity: 0.7 !important;
    position: relative !important;
    z-index: 1 !important;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: 1.3rem !important;
    font-style: italic !important;
    letter-spacing: 0.04em !important;
    font-weight: 500 !important;
}

.courses-hero .hero-badge {
    display: inline-block !important;
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-weight: 700 !important;
    font-size: 0.8rem !important;
    letter-spacing: 0.15em !important;
    text-transform: uppercase !important;
    background: rgba(26, 79, 122, 0.1) !important;
    color: #1a4f7a !important;
    padding: 8px 28px !important;
    border-radius: 4px !important;
    border: 1px solid rgba(26, 79, 122, 0.08) !important;
    margin-bottom: 16px !important;
    position: relative !important;
    z-index: 1 !important;
}

.courses-hero .hero-waves {
    position: absolute !important;
    bottom: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 40px !important;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23f7fafc" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') !important;
    background-size: cover !important;
    background-repeat: no-repeat !important;
    pointer-events: none !important;
}

}

.search-input {

}

}

    padding-left: 40px !important;

/* ===== КАРТОЧКИ КУРСОВ ===== */
.course-card {

.course-card .card-body {

.btn-course:hover {

/* ===== ЛОАДЕР ===== */

    border-radius: 50% !important;
    animation: spin 0.6s linear infinite !important;

@keyframes spin {

/* ===== АДАПТИВ ===== */

}

@media (max-width: 768px) {

        font-size: 2.4rem !important;

        font-size: 1.1rem !important;
    }

    }

    }

@media (max-width: 480px) {

        padding: 30px 0 20px !important;

    .courses-hero h1 {
        font-size: 1.8rem !important;
    }
    .courses-hero p {
        font-size: 0.95rem !important;
    }
    .courses-hero .hero-badge {
        font-size: 0.65rem !important;
        padding: 6px 18px !important;
    }
    .filter-sidebar {
        padding: 14px !important;
    }
    .filter-title {
        font-size: 1rem !important;
    }
    .course-card-img {
        height: 110px !important;
    }
    .course-card .card-title {
        font-size: 0.95rem !important;
    }
    .course-card .card-text {
        font-size: 0.85rem !important;
    }
    .btn-course {
        font-size: 0.75rem !important;
        padding: 5px 12px !important;
    }
    .result-count {
        font-size: 0.85rem !important;

    }

{% block content %}
<!-- Герой-секция (как на главной - светлая) -->
<div class="courses-hero">
    <div class="hero-waves"></div>
    <div class="container text-center">
        <div class="hero-badge">Система дистанционного обучения</div>
        <h1 class="fw-bold">
            <span class="accent">Все</span> курсы
        </h1>
        <p class="lead mb-0">Выберите программу повышения квалификации</p>
    </div>
</div>

<div class="container mt-4 mb-5">
    <div class="row g-4">
        <!-- Фильтры - боковая панель -->
        <div class="col-lg-3">
            <div class="filter-sidebar">
                <h5 class="filter-title"><i class="bi bi-funnel me-2"></i>Фильтры</h5>
                
                <!-- Поиск -->
                <div class="filter-group">
                    <label><i class="bi bi-search me-1"></i>Поиск</label>
                    <div class="search-input">
                        <i class="bi bi-search"></i>
                        <input type="text" class="form-control" id="searchInput" placeholder="Название курса...">
                    </div>
                </div>
                
                <!-- Категории -->
                <div class="filter-group">
                    <label><i class="bi bi-folder me-1"></i>Категории</label>
                    <div id="categoriesList"></div>
                </div>
                
                <!-- Формат обучения -->
                <div class="filter-group">
                    <label><i class="bi bi-calendar-event me-1"></i>Формат обучения</label>
                    <div class="filter-check">
                        <input type="checkbox" id="formatOnline">
                        <label for="formatOnline">Онлайн</label>
                    </div>
                    <div class="filter-check">
                        <input type="checkbox" id="formatFullTime">
                        <label for="formatFullTime">Очный</label>
                    </div>
                    <div class="filter-check">
                        <input type="checkbox" id="formatPartTime">
                        <label for="formatPartTime">Заочный</label>
                    </div>
                    <div class="filter-check">
                        <input type="checkbox" id="formatFullPartTime">
                        <label for="formatFullPartTime">Очно-заочный</label>
                    </div>
                </div>
                
                <!-- Кнопка сброса фильтров -->
                <button class="clear-filters" onclick="resetFilters()">
                    <i class="bi bi-arrow-clockwise me-2"></i>Сбросить фильтры
                </button>
            </div>
        </div>
        
        <!-- Список курсов -->
        <div class="col-lg-9">
            <div id="resultCount" class="result-count">
                <i class="bi bi-grid-3x3-gap-fill me-2" style="color: #1a4f7a;"></i>
                <span id="coursesCount">Загрузка...</span>
            </div>
            <div class="row g-4" id="coursesList">
                <div class="text-center py-5">
                    <div class="loading-spinner"></div>
                    <p class="mt-3 text-muted" style="font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 500; color: #4a5a6a;">Загрузка курсов...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    let allCourses = [];
    let allCategories = [];
    let filteredCount = 0;
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    const formatMap = {
        'full_time': 'Очный',
        'part_time': 'Заочный',
        'full_part_time': 'Очно-заочный',
        'online': 'Онлайн'
    };
    
    const formatBadgeClass = {
        'online': 'badge-format-online',
        'full_time': 'badge-format-full_time',
        'part_time': 'badge-format-part_time',
        'full_part_time': 'badge-format-full_part_time'
    };
    
    async function loadCategories() {
        try {
            const response = await fetch('/api/admin/categories', {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            if (response.ok) {
                allCategories = await response.json();
                renderCategoriesFilter();
            }
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }
    
    function renderCategoriesFilter() {
        const container = document.getElementById('categoriesList');
        if (!container) return;
        
        if (allCategories.length === 0) {
            container.innerHTML = '<p style="font-family: \'Cormorant Garamond\', serif; font-size: 0.9rem; color: #4a5a6a;">Нет категорий</p>';
            return;
        }
        
        let html = '';
        allCategories.forEach(cat => {
            const count = cat.courses_count || 0;
            html += `
                <div class="category-check">
                    <input type="checkbox" class="category-checkbox" id="cat_${cat.id}" value="${cat.id}">
                    <label for="cat_${cat.id}">${escapeHtml(cat.name)}</label>
                    <span class="count-badge">${count}</span>
                </div>
            `;
        });
        container.innerHTML = html;
        
        document.querySelectorAll('.category-checkbox').forEach(cb => {
            cb.addEventListener('change', filterCourses);
        });
    }
    
    function getSelectedCategories() {
        const selected = [];
        document.querySelectorAll('.category-checkbox:checked').forEach(cb => {
            selected.push(parseInt(cb.value));
        });
        return selected;
    }
    
    function getSelectedFormats() {
        const formats = [];
        if (document.getElementById('formatOnline')?.checked) formats.push('online');
        if (document.getElementById('formatFullTime')?.checked) formats.push('full_time');
        if (document.getElementById('formatPartTime')?.checked) formats.push('part_time');
        if (document.getElementById('formatFullPartTime')?.checked) formats.push('full_part_time');
        return formats;
    }
    
    function filterCourses() {
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const selectedCategories = getSelectedCategories();
        const selectedFormats = getSelectedFormats();
        
        let filtered = [...allCourses];
        
        if (searchTerm) {
            filtered = filtered.filter(course => 
                course.title.toLowerCase().includes(searchTerm) || 
                (course.description && course.description.toLowerCase().includes(searchTerm)) ||
                (course.short_description && course.short_description.toLowerCase().includes(searchTerm))
            );
        }
        
        if (selectedCategories.length > 0) {
            filtered = filtered.filter(course => 
                course.category_id && selectedCategories.includes(course.category_id)
            );
        }
        
        if (selectedFormats.length > 0) {
            filtered = filtered.filter(course => 
                course.format_type && selectedFormats.includes(course.format_type)
            );
        }
        
        filteredCount = filtered.length;
        renderCourses(filtered);
        updateResultCount();
    }
    
    function updateResultCount() {
        const countEl = document.getElementById('coursesCount');
        if (countEl) {
            countEl.innerHTML = `<strong>${filteredCount}</strong> ${filteredCount === 1 ? 'курс' : (filteredCount < 5 ? 'курса' : 'курсов')}`;
        }
    }
    
    async function loadCourses() {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        
        try {
            const response = await fetch('/api/courses/', { headers });
            
            if (!response.ok) {
                throw new Error('Ошибка загрузки');
            }
            
            const result = await response.json();
            
            // Проверяем, вернулся ли объект с пагинацией или массив
            if (result.items) {
                // Новый формат с пагинацией
                allCourses = result.items;
            } else if (Array.isArray(result)) {
                // Старый формат (массив)
                allCourses = result;
            } else {
                // Неизвестный формат
                allCourses = [];
                console.error('Неизвестный формат ответа:', result);
            }
            
            filterCourses();
            
        } catch (error) {
            console.error('Error loading courses:', error);
            document.getElementById('coursesList').innerHTML = `
                <div class="no-results">
                    <i class="bi bi-exclamation-triangle" style="color: #dc2626;"></i>
                    <h5>Ошибка загрузки</h5>
                    <p>Не удалось загрузить курсы. Пожалуйста, попробуйте позже.</p>
                    <button class="btn-primary" onclick="loadCourses()">
                        <i class="bi bi-arrow-repeat me-2"></i>Повторить
                    </button>
                </div>
            `;
            document.getElementById('coursesCount').textContent = 'Ошибка';
        }
    }
    
    function renderCourses(courses) {
        const container = document.getElementById('coursesList');
        
        if (!courses || courses.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    <i class="bi bi-inbox"></i>
                    <h5>Курсы не найдены</h5>
                    <p>Попробуйте изменить параметры поиска или фильтры</p>
                    <button class="btn-primary" onclick="resetFilters()">Сбросить фильтры</button>
                </div>
            `;
            return;
        }
        
        let html = '';
        courses.forEach(course => {
            const formatText = formatMap[course.format_type] || 'Онлайн';
            const badgeClass = formatBadgeClass[course.format_type] || 'badge-format-online';
            const categoryName = course.category_name || 'Обучение';
            
            html += `
                <div class="col-md-6 col-lg-4">
                    <div class="course-card">
                        <div class="format-badge">
                            <span class="badge ${badgeClass}">${formatText}</span>
                        </div>
                        <div class="course-badge">
                            <span class="badge">${escapeHtml(categoryName)}</span>
                        </div>
                        ${course.image_url ? 
                            `<img src="${course.image_url}" class="course-card-img" alt="${escapeHtml(course.title)}" loading="lazy">` :
                            `<div class="course-card-img d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);">
                                <i class="bi bi-book" style="font-size: 3rem; color: #1a4f7a; opacity: 0.4;"></i>
                            </div>`
                        }
                        <div class="card-body">
                            <h5 class="card-title">${escapeHtml(course.title)}</h5>
                            <p class="card-text">${escapeHtml(course.short_description ? course.short_description.substring(0, 80) : (course.description ? course.description.substring(0, 80) : "Описание курса"))}...</p>
                            <div class="course-meta">
                                <span class="participants">
                                    <i class="bi bi-people"></i> ${course.current_participants || 0}/${course.max_participants || 0}
                                </span>
                                <a href="/course/${course.id}" class="btn-course">
                                    Подробнее <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    function resetFilters() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        
        document.querySelectorAll('.category-checkbox').forEach(cb => {
            cb.checked = false;
        });
        
        document.getElementById('formatOnline') && (document.getElementById('formatOnline').checked = false);
        document.getElementById('formatFullTime') && (document.getElementById('formatFullTime').checked = false);
        document.getElementById('formatPartTime') && (document.getElementById('formatPartTime').checked = false);
        document.getElementById('formatFullPartTime') && (document.getElementById('formatFullPartTime').checked = false);
        
        filterCourses();
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', filterCourses);
        }
        
        const formats = ['formatOnline', 'formatFullTime', 'formatPartTime', 'formatFullPartTime'];
        formats.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('change', filterCourses);
        });
    });
    
    loadCategories();
    loadCourses();
</script>
{% endblock %}
