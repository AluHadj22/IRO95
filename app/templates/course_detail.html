{% extends "base.html" %}

{% block title %}Курс - ГБУ ДПО «ИРО ЧР»{% endblock %}

{% block extra_css %}
<style>
    .moodle-badge {
        background: #f0f7ff;
        border: 1px solid #b3d4fc;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #1a56db;
        margin-bottom: 12px;
    }
    .moodle-badge i {
        font-size: 1.1rem;
    }
    
    /* Стили для модального окна профиля */
    .profile-incomplete-modal .modal-content {
        border-radius: 16px;
        border: none;
        overflow: hidden;
    }
    .profile-incomplete-modal .modal-header {
        background: #ef4444;
        color: white;
        border: none;
        padding: 18px 24px;
    }
    .profile-incomplete-modal .modal-header .btn-close {
        filter: brightness(0) invert(1);
        opacity: 0.8;
    }
    .profile-incomplete-modal .modal-body {
        padding: 24px;
    }
    .profile-incomplete-modal .missing-sections-list {
        list-style: none;
        padding: 0;
        margin: 12px 0 20px 0;
    }
    .profile-incomplete-modal .missing-sections-list li {
        padding: 10px 14px;
        margin-bottom: 8px;
        background: #fef2f2;
        border-radius: 10px;
        border-left: 4px solid #ef4444;
    }
    .profile-incomplete-modal .missing-sections-list li .section-label {
        font-weight: 600;
        color: #dc2626;
        display: block;
        margin-bottom: 4px;
        font-size: 0.95rem;
    }
    .profile-incomplete-modal .missing-sections-list li .section-fields {
        font-size: 0.85rem;
        color: #6b7280;
        display: block;
    }
    .profile-incomplete-modal .missing-sections-list li .section-fields .field-item {
        display: inline-block;
        background: white;
        padding: 1px 10px;
        border-radius: 12px;
        margin: 2px 4px 2px 0;
        font-size: 0.75rem;
        color: #dc2626;
        border: 1px solid #fecaca;
    }
    .profile-incomplete-modal .alert-info-custom {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        padding: 12px 16px;
        color: #1e40af;
        font-size: 0.9rem;
    }
    .profile-incomplete-modal .alert-info-custom i {
        margin-right: 8px;
    }
    .profile-incomplete-modal .btn-go-profile {
        background: linear-gradient(135deg, #0057A4 0%, #2b7bcf 100%);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 24px;
        font-weight: 600;
        transition: all 0.2s ease;
    }
    .profile-incomplete-modal .btn-go-profile:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0,87,164,0.3);
    }
    .profile-incomplete-modal .btn-close-modal {
        border: 1px solid #d1d5db;
        background: transparent;
        border-radius: 10px;
        padding: 10px 24px;
        font-weight: 500;
        color: #6b7280;
        transition: all 0.2s ease;
    }
    .profile-incomplete-modal .btn-close-modal:hover {
        background: #f3f4f6;
    }
    .profile-incomplete-modal .progress-status {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding: 12px 16px;
        background: #f8fafc;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
    }
    .profile-incomplete-modal .progress-status .progress-bar-mini {
        flex: 1;
        height: 8px;
        background: #e5e7eb;
        border-radius: 10px;
        overflow: hidden;
    }
    .profile-incomplete-modal .progress-status .progress-bar-mini .fill {
        height: 100%;
        background: linear-gradient(135deg, #0057A4 0%, #2b7bcf 100%);
        border-radius: 10px;
        transition: width 0.5s ease;
    }
    .profile-incomplete-modal .progress-status .progress-text {
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        white-space: nowrap;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-4" id="courseContainer">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-muted">Загрузка курса...</p>
    </div>
</div>

<script>
    const courseId = {{ course_id }};
    let courseData = null;
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    const formatMap = {
        'full_time': 'Очный',
        'part_time': 'Заочный',
        'full_part_time': 'Очно-заочный',
        'online': 'Онлайн'
    };
    
    async function loadCourse() {
        const token = localStorage.getItem('token');
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        
        try {
            const response = await fetch(`/api/courses/${courseId}`, { headers });
            
            if (!response.ok) {
                throw new Error('Курс не найден');
            }
            
            courseData = await response.json();
            renderCourse(courseData);
            
        } catch (error) {
            console.error('Error loading course:', error);
            document.getElementById('courseContainer').innerHTML = `
                <div class="text-center py-5">
                    <div class="bg-light rounded-circle d-inline-flex p-4 mb-4">
                        <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Курс не найден</h3>
                    <p class="text-muted mb-4">Запрашиваемый курс не существует или был удалён</p>
                    <a href="/courses" class="btn btn-primary px-4 py-2 rounded-pill">
                        <i class="bi bi-arrow-left me-2"></i>Вернуться к курсам
                    </a>
                </div>
            `;
        }
    }
    
    function renderCourse(course) {
        const container = document.getElementById('courseContainer');
        const courseFormat = formatMap[course.format_type] || 'Онлайн';
        
        const token = localStorage.getItem('token');
        const isAuthenticated = !!token;
        
        // ========== MOODLE БЛОК ==========
        let moodleHtml = '';
        if (course.moodle_course_id) {
            moodleHtml = `
                <div class="moodle-badge">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span>Курс привязан к Moodle (ID: ${course.moodle_course_id})</span>
                </div>
            `;
        }
        
        // Спикеры
        let speakersHtml = '';
        if (course.speakers && course.speakers.length > 0) {
            speakersHtml = `
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h4 class="mb-0 fw-bold" style="color: var(--dark);">
                            <i class="bi bi-people-fill me-2" style="color: var(--primary);"></i>
                            Эксперты курса
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row g-4">
            `;
            course.speakers.forEach(speaker => {
                speakersHtml += `
                    <div class="col-md-6 col-lg-4">
                        <div class="speaker-card h-100">
                            <div class="text-center">
                                <img src="${speaker.photo_url || 'https://ui-avatars.com/api/?background=059669&color=fff&rounded=true&size=100&bold=true&name=' + encodeURIComponent(speaker.full_name.split(' ')[0])}" 
                                     class="speaker-img" 
                                     alt="${escapeHtml(speaker.full_name)}"
                                     style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); padding: 3px;">
                            </div>
                            <div class="text-center mt-3">
                                <h5 class="fw-bold mb-1">${escapeHtml(speaker.full_name)}</h5>
                                <p class="text-muted small mb-2">${escapeHtml(speaker.position || 'Эксперт')}</p>
                                ${speaker.bio ? `<p class="small text-muted">${escapeHtml(speaker.bio.length > 100 ? speaker.bio.substring(0, 100) + '...' : speaker.bio)}</p>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            speakersHtml += `
                        </div>
                    </div>
                </div>
            `;
        }
        
        const html = `
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm mb-4 overflow-hidden">
                        ${course.image_url ? 
                            `<img src="${course.image_url}" class="card-img-top" alt="${escapeHtml(course.title)}" style="max-height: 400px; object-fit: cover; width: 100%;">` : 
                            `<div class="bg-light text-center py-5" style="background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);">
                                <i class="bi bi-image fs-1 text-muted"></i>
                                <p class="text-muted mt-2">Изображение отсутствует</p>
                            </div>`
                        }
                        <div class="card-body p-4">
                            ${moodleHtml}
                            <h1 class="fw-bold mb-3" style="color: var(--dark);">${escapeHtml(course.title)}</h1>
                            
                            <div class="d-flex gap-3 mb-4">
                                <button class="btn btn-outline-danger rounded-pill px-4" id="favoriteBtn" onclick="toggleFavorite()" ${!isAuthenticated ? 'disabled' : ''}>
                                    <i class="bi bi-heart me-1"></i> Избранное
                                </button>
                                <button class="btn btn-outline-warning rounded-pill px-4" id="watchLaterBtn" onclick="toggleWatchLater()" ${!isAuthenticated ? 'disabled' : ''}>
                                    <i class="bi bi-clock me-1"></i> Посмотреть позже
                                </button>
                            </div>
                            
                            <div class="mb-4">
                                <span class="badge bg-success me-2">${escapeHtml(course.category_name || "Без категории")}</span>
                                ${course.hashtags ? course.hashtags.split(' ').map(tag => `<span class="badge bg-secondary me-1">${escapeHtml(tag)}</span>`).join('') : ''}
                            </div>
                            
                            <h5 class="fw-bold mb-3" style="color: var(--dark);">Описание курса</h5>
                            <p class="text-muted lh-lg">${escapeHtml(course.description || 'Нет описания')}</p>
                            
                            ${course.video_url ? `
                                <div class="mt-4">
                                    <h5 class="fw-bold mb-3" style="color: var(--dark);">
                                        <i class="bi bi-play-circle-fill me-2" style="color: var(--primary);"></i>
                                        Видео-презентация
                                    </h5>
                                    <div class="ratio ratio-16x9 rounded-3 overflow-hidden shadow-sm">
                                        <iframe src="${course.video_url.replace('watch?v=', 'embed/').replace('youtu.be/', 'www.youtube.com/embed/')}" 
                                                allowfullscreen
                                                loading="lazy"></iframe>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    ${speakersHtml}
                </div>
                
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm sticky-top" style="top: 90px;">
                        <div class="card-body p-4">
                            <div class="text-center mb-4">
                                <p class="text-muted small mt-2">
                                    <i class="bi bi-people me-1"></i> Мест: ${course.current_participants}/${course.max_participants}
                                </p>
                            </div>
                            
                            <hr class="my-3">
                            
                            <div class="mb-4">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted"><i class="bi bi-calendar me-2"></i>Начало</span>
                                    <span class="fw-medium">${course.start_date ? new Date(course.start_date).toLocaleDateString() : 'Скоро'}</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted"><i class="bi bi-calendar-check me-2"></i>Окончание</span>
                                    <span class="fw-medium">${course.end_date ? new Date(course.end_date).toLocaleDateString() : 'По набору'}</span>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted"><i class="bi bi-person-badge me-2"></i>Формат</span>
                                    <span class="fw-medium">${courseFormat}</span>
                                </div>
                            </div>
                            
                            <button class="btn w-100 btn-lg mb-3" id="registerBtn" onclick="handleRegistration()"
                                    style="background: var(--primary-gradient); color: white; border: none; border-radius: 12px; font-weight: 600;">
                                <i class="bi bi-pencil-square me-2"></i>Записаться на курс
                            </button>
                            
                            <div class="bg-light rounded-3 p-3 mt-3">
                                <p class="small text-muted mb-2"><i class="bi bi-info-circle me-1"></i> Информация</p>
                                <p class="small text-muted mb-1">После успешной записи вы получите уведомление на email.</p>
                                <p class="small text-muted mb-0">Все материалы курса будут доступны в личном кабинете.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
        
        // Обновляем состояние кнопок если пользователь авторизован
        if (isAuthenticated) {
            const favBtn = document.getElementById('favoriteBtn');
            const wlBtn = document.getElementById('watchLaterBtn');
            
            if (course.is_favorite) {
                favBtn.classList.add('active');
                favBtn.innerHTML = '<i class="bi bi-heart-fill me-1"></i> В избранном';
                favBtn.style.backgroundColor = '#fee2e2';
                favBtn.style.borderColor = '#ef4444';
                favBtn.style.color = '#dc2626';
            }
            if (course.is_watch_later) {
                wlBtn.classList.add('active');
                wlBtn.innerHTML = '<i class="bi bi-clock-fill me-1"></i> В списке';
                wlBtn.style.backgroundColor = '#fef3c7';
                wlBtn.style.borderColor = '#f59e0b';
                wlBtn.style.color = '#d97706';
            }
        } else {
            const favBtn = document.getElementById('favoriteBtn');
            const wlBtn = document.getElementById('watchLaterBtn');
            if (favBtn) favBtn.title = 'Войдите в систему, чтобы добавить в избранное';
            if (wlBtn) wlBtn.title = 'Войдите в систему, чтобы добавить в список';
        }
    }
    
    async function toggleFavorite() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.showToast) window.showToast('Войдите в систему', 'danger');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }
        
        const btn = document.getElementById('favoriteBtn');
        const isActive = btn.classList.contains('active');
        
        const response = await fetch(`/api/courses/${courseId}/favorite`, {
            method: isActive ? 'DELETE' : 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (response.ok) {
            if (isActive) {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="bi bi-heart me-1"></i> Избранное';
                btn.style.backgroundColor = '';
                btn.style.borderColor = '';
                btn.style.color = '';
                if (window.showToast) window.showToast('Удалено из избранного', 'success');
            } else {
                btn.classList.add('active');
                btn.innerHTML = '<i class="bi bi-heart-fill me-1"></i> В избранном';
                btn.style.backgroundColor = '#fee2e2';
                btn.style.borderColor = '#ef4444';
                btn.style.color = '#dc2626';
                if (window.showToast) window.showToast('Добавлено в избранное', 'success');
            }
        }
    }
    
    async function toggleWatchLater() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.showToast) window.showToast('Войдите в систему', 'danger');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }
        
        const btn = document.getElementById('watchLaterBtn');
        const isActive = btn.classList.contains('active');
        
        const response = await fetch(`/api/courses/${courseId}/watch-later`, {
            method: isActive ? 'DELETE' : 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        
        if (response.ok) {
            if (isActive) {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="bi bi-clock me-1"></i> Посмотреть позже';
                btn.style.backgroundColor = '';
                btn.style.borderColor = '';
                btn.style.color = '';
                if (window.showToast) window.showToast('Удалено из "Посмотреть позже"', 'success');
            } else {
                btn.classList.add('active');
                btn.innerHTML = '<i class="bi bi-clock-fill me-1"></i> В списке';
                btn.style.backgroundColor = '#fef3c7';
                btn.style.borderColor = '#f59e0b';
                btn.style.color = '#d97706';
                if (window.showToast) window.showToast('Добавлено в "Посмотреть позже"', 'success');
            }
        }
    }
    
    // ========== ОБНОВЛЕННАЯ ФУНКЦИЯ РЕГИСТРАЦИИ (БЕЗ ОПЛАТЫ) ==========
    
    async function handleRegistration() {
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.showToast) window.showToast('Войдите в систему, чтобы записаться на курс', 'danger');
            setTimeout(() => window.location.href = '/login', 1500);
            return;
        }
        
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Проверка...';
        
        try {
            // ========== СНАЧАЛА ПРОВЕРЯЕМ ВОЗМОЖНОСТЬ ЗАПИСИ ==========
            const checkResponse = await fetch(`/api/courses/${courseId}/check-registration-eligibility`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (checkResponse.ok) {
                const checkResult = await checkResponse.json();
                
                if (!checkResult.eligible) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    
                    if (checkResult.reason === 'profile_incomplete') {
                        // ========== ПРОФИЛЬ НЕ ЗАПОЛНЕН - ПОКАЗЫВАЕМ МОДАЛЬНОЕ ОКНО С РАЗДЕЛАМИ ==========
                        showProfileIncompleteModal(checkResult.missing_sections, checkResult.redirect);
                    } else if (checkResult.reason === 'already_registered') {
                        if (window.showToast) window.showToast('Вы уже записаны на этот курс', 'warning');
                    } else if (checkResult.reason === 'course_full') {
                        if (window.showToast) window.showToast('Курс полностью заполнен', 'danger');
                    } else {
                        if (window.showToast) window.showToast(checkResult.message || 'Невозможно записаться', 'warning');
                    }
                    return;
                }
            }
            
            // ========== ПРОВЕРКА ПРОЙДЕНА - ПРОДОЛЖАЕМ РЕГИСТРАЦИЮ ==========
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Запись...';
            
            const regResponse = await fetch(`/api/courses/${courseId}/register`, {
                method: 'POST',
                headers: { 
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            });
            
            if (regResponse.ok) {
                const result = await regResponse.json();
                if (window.showToast) window.showToast(result.message || 'Вы успешно записаны на курс!', 'success');
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Вы записаны';
                btn.style.background = '#10b981';
                
                if (result.moodle_course_url) {
                    setTimeout(() => {
                        window.showToast('Курс также доступен в Moodle!', 'info');
                    }, 1000);
                }
                
                setTimeout(() => location.reload(), 3000);
            } else if (regResponse.status === 403) {
                const error = await regResponse.json();
                if (error.detail && typeof error.detail === 'object' && error.detail.code === 'profile_incomplete') {
                    showProfileIncompleteModal(error.detail.missing_sections, error.detail.redirect);
                } else {
                    if (window.showToast) window.showToast(error.detail || 'Ошибка записи на курс', 'danger');
                }
                btn.disabled = false;
                btn.innerHTML = originalText;
            } else {
                const error = await regResponse.json();
                if (window.showToast) window.showToast(error.detail || 'Ошибка записи на курс', 'danger');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            if (window.showToast) window.showToast('Ошибка соединения с сервером', 'danger');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    
    // ========== ОБНОВЛЕННОЕ МОДАЛЬНОЕ ОКНО ДЛЯ НЕЗАПОЛНЕННОГО ПРОФИЛЯ ==========
    
    function showProfileIncompleteModal(missingSections, redirectUrl) {
        // Удаляем старый модал, если есть
        const existingModal = document.getElementById('profileIncompleteModal');
        if (existingModal) {
            const modal = bootstrap.Modal.getInstance(existingModal);
            if (modal) modal.hide();
            existingModal.remove();
        }
        
        // Считаем общее количество разделов и заполненных
        let totalSections = 0;
        let completedSections = 0;
        let sectionsHtml = '';
        
        if (missingSections && Array.isArray(missingSections)) {
            totalSections = missingSections.length;
            completedSections = missingSections.filter(s => s.is_complete).length;
            
            const incompleteSections = missingSections.filter(s => !s.is_complete);
            
            if (incompleteSections.length > 0) {
                sectionsHtml = incompleteSections.map(section => {
                    const fieldsHtml = section.fields && section.fields.length > 0 
                        ? section.fields.map(f => `<span class="field-item">${escapeHtml(f)}</span>`).join('')
                        : '';
                    
                    return `
                        <li>
                            <span class="section-label">${escapeHtml(section.label)}</span>
                            ${fieldsHtml ? `<span class="section-fields">${fieldsHtml}</span>` : ''}
                        </li>
                    `;
                }).join('');
            }
        }
        
        // Если нет данных о разделах, показываем общее сообщение
        if (!sectionsHtml) {
            sectionsHtml = `
                <li>
                    <span class="section-label">Необходимо заполнить все разделы профиля</span>
                    <span class="section-fields">Личные данные, Образование, Работа, Документы</span>
                </li>
            `;
        }
        
        const progressPercent = totalSections > 0 ? Math.round((completedSections / totalSections) * 100) : 0;
        
        const modalHtml = `
            <div class="modal fade profile-incomplete-modal" id="profileIncompleteModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                Профиль не заполнен
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="text-center mb-3">
                                <i class="bi bi-person-x fs-1" style="color: #ef4444;"></i>
                            </div>
                            
                            <div class="progress-status">
                                <span class="progress-text">${progressPercent}%</span>
                                <div class="progress-bar-mini">
                                    <div class="fill" style="width: ${progressPercent}%"></div>
                                </div>
                                <span class="progress-text" style="font-weight: 400; color: #6b7280; font-size: 0.75rem;">
                                    ${completedSections}/${totalSections}
                                </span>
                            </div>
                            
                            <p style="font-weight: 500; color: #1e293b;">
                                Для записи на курсы необходимо заполнить все разделы профиля:
                            </p>
                            <ul class="missing-sections-list">
                                ${sectionsHtml}
                            </ul>
                            <div class="alert-info-custom">
                                <i class="bi bi-info-circle"></i>
                                После заполнения всех разделов вы сможете записаться на курсы.
                            </div>
                        </div>
                        <div class="modal-footer" style="border-top: 1px solid #e5e7eb; padding: 16px 24px;">
                            <button class="btn-close-modal" data-bs-dismiss="modal">
                                Закрыть
                            </button>
                            <button class="btn-go-profile" onclick="redirectToProfile('${redirectUrl || '/profile'}')">
                                <i class="bi bi-person-badge me-2"></i>
                                Перейти в Мои данные
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const modalElement = document.getElementById('profileIncompleteModal');
        const modal = new bootstrap.Modal(modalElement, {
            backdrop: 'static',
            keyboard: false
        });
        modal.show();
    }
    
    function redirectToProfile(url) {
        const modalElement = document.getElementById('profileIncompleteModal');
        if (modalElement) {
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) modal.hide();
        }
        setTimeout(() => {
            window.location.href = url;
        }, 300);
    }
    
    loadCourse();
</script>
{% endblock %}
