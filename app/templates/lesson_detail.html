{% block content %}
<div class="lesson-container">
    <div id="lessonContent">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3">Загрузка урока...</p>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const lessonId = {{ lesson_id }};
    let lessonData = null;
    let assignmentStatus = null;
    let selectedFiles = {};
    let timerInterval = null;
    let timeRemaining = 0;
    let videoCheckInterval = null;
    let timeSpentSeconds = 0;
    let timeTrackingInterval = null;
    let isSubmitting = false;
    
    if (!token) {
        document.getElementById('lessonContent').innerHTML = `
            <div class="error-container">
                <i class="bi bi-lock-fill"></i>
                <h3>Требуется авторизация</h3>
                <p>Для просмотра урока необходимо войти в систему</p>
                <a href="/login" class="btn btn-primary">Войти</a>
            </div>
        `;
    } else {
        loadLesson();
    }
    
    function parseOptions(options) {
        if (!options) return [];
        if (Array.isArray(options)) return options;
        if (typeof options === 'string') {
            try {
                const parsed = JSON.parse(options);
                if (Array.isArray(parsed)) return parsed;
                if (typeof parsed === 'string') {
                    try {
                        const doubleParsed = JSON.parse(parsed);
                        return Array.isArray(doubleParsed) ? doubleParsed : [];
                    } catch(e) {
                        return [];
                    }
                }
                return [];
            } catch(e) {
                console.warn('Failed to parse options:', options, e);
                return [];
            }
        }
        return [];
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    
    function getFileIcon(fileType) {
        const icons = {
            'pdf': 'filetype-pdf',
            'doc': 'filetype-doc',
            'docx': 'filetype-docx',
            'ppt': 'filetype-ppt',
            'pptx': 'filetype-pptx',
            'txt': 'filetype-txt',
            'md': 'filetype-md'
        };
        return icons[fileType] || 'file-earmark-text';
    }
    
    function getFileEmoji(fileType) {
        const emojis = {
            'pdf': '📄',
            'doc': '📝',
            'docx': '📝',
            'ppt': '📊',
            'pptx': '📊',
            'txt': '📄',
            'md': '📄'
        };
        return emojis[fileType] || '📄';
    }
    
    function getFileTypeName(fileType) {
        const names = {
            'pdf': 'PDF',
            'doc': 'Word',
            'docx': 'Word',
            'ppt': 'PowerPoint',
            'pptx': 'PowerPoint',
            'txt': 'Текст',
            'md': 'Markdown'
        };
        return names[fileType] || 'Файл';
    }
    
    async function loadLesson() {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        
        try {
            const response = await fetch(`/api/lms/lessons/${lessonId}`, { headers });
            
            if (!response.ok) {
                if (response.status === 401) {
                    throw new Error('Требуется авторизация');
                } else if (response.status === 403) {
                    throw new Error('У вас нет доступа к этому уроку. Возможно, вы не записаны на курс.');
                } else if (response.status === 404) {
                    throw new Error('Урок не найден');
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'Ошибка загрузки урока');
                }
            }
            
            lessonData = await response.json();
            
            if (lessonData.assignment) {
                await loadAssignmentStatus();
            }
            
            renderLesson();
            
        } catch (error) {
            console.error('Error loading lesson:', error);
            document.getElementById('lessonContent').innerHTML = `
                <div class="error-container">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <h3>Ошибка загрузки урока</h3>
                    <p>${escapeHtml(error.message)}</p>
                    <a href="javascript:history.back()" class="btn btn-outline-primary me-2">Назад</a>
                    <a href="/courses" class="btn btn-primary">К курсам</a>
                </div>
            `;
        }
    }
    
    async function loadAssignmentStatus() {
        if (!lessonData || !lessonData.assignment) return;
        
        try {
            const response = await fetch(`/api/lms/assignments/${lessonData.assignment.id}/status`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (response.ok) {
                assignmentStatus = await response.json();
                console.log('Статус задания:', assignmentStatus);
            }
        } catch (error) {
            console.error('Error loading assignment status:', error);
        }
    }
    
    function canCompleteLesson() {
        if (!lessonData || !lessonData.assignment) {
            return true;
        }
        
        if (lessonData.is_completed) {
            return false;
        }
        
        if (!assignmentStatus) {
            return false;
        }
        
        if (assignmentStatus.status === 'passed') {
            return true;
        }
        
        if (assignmentStatus.status === 'retake') {
            return false;
        }
        
        if (assignmentStatus.is_overdue) {
            return false;
        }
        
        return false;
    }
    
    function isRetake() {
        return assignmentStatus && assignmentStatus.status === 'retake';
    }
    
    function isPending() {
        return assignmentStatus && (assignmentStatus.status === 'pending_teacher' || assignmentStatus.status === 'submitted');
    }
    
    function isFailed() {
        return assignmentStatus && assignmentStatus.status === 'failed';
    }
    
    function isOverdue() {
        return assignmentStatus && assignmentStatus.is_overdue === true;
    }
    
    function hasNoAttempts() {
        return assignmentStatus && assignmentStatus.remaining_attempts === 0 && assignmentStatus.max_attempts > 0;
    }
    
    function renderLesson() {
        const container = document.getElementById('lessonContent');
        
        let html = `
            <div class="lesson-header">
                <h1 class="lesson-title">${escapeHtml(lessonData.title)}</h1>
                <div class="lesson-meta">
                    ${lessonData.duration_minutes > 0 ? `<span><i class="bi bi-clock"></i> ${lessonData.duration_minutes} мин</span>` : ''}
                    ${lessonData.has_assignment ? `<span><i class="bi bi-pencil-square"></i> Есть задание</span>` : ''}
                    ${lessonData.is_completed ? `<span class="text-success"><i class="bi bi-check-circle-fill"></i> Пройдено</span>` : '<span class="text-warning"><i class="bi bi-clock-history"></i> Не пройдено</span>'}
                    ${lessonData.deadline ? `<span class="deadline ${new Date(lessonData.deadline) < new Date() ? 'overdue' : ''}"><i class="bi bi-calendar-exclamation"></i> Дедлайн: ${new Date(lessonData.deadline).toLocaleDateString()} ${new Date(lessonData.deadline).toLocaleTimeString()}</span>` : ''}
                    ${lessonData.allow_retake ? `<span class="text-muted"><i class="bi bi-arrow-repeat"></i> Пересдача разрешена</span>` : `<span class="text-muted"><i class="bi bi-x-circle"></i> Пересдача запрещена</span>`}
                </div>
            </div>
            
            <div class="lesson-content">
                ${lessonData.video_url ? `
                    <div class="video-container" id="videoContainer">
                        <iframe id="lessonVideo" src="${getEmbedUrl(lessonData.video_url)}" 
                                allowfullscreen
                                allow="autoplay; encrypted-media"
                                onload="initVideoTracking()"></iframe>
                        <div class="video-progress-overlay">
                            <div class="progress-fill" id="videoProgressFill"></div>
                        </div>
                    </div>
                ` : ''}
                
                ${lessonData.content ? `<div class="lesson-text">${lessonData.content}</div>` : ''}
                
                <!-- Файл лекции -->
                ${lessonData.has_lecture_file && lessonData.lecture_file_url ? `
                    <div class="lecture-file-section" id="lectureFileSection">
                        <div class="file-info">
                            <div class="file-icon">${getFileEmoji(lessonData.lecture_file_type)}</div>
                            <div>
                                <div class="file-name">${escapeHtml(lessonData.lecture_file_name)}</div>
                                <div class="file-size">${getFileTypeName(lessonData.lecture_file_type)} • ${formatFileSize(lessonData.lecture_file_size)}</div>
                            </div>
                        </div>
                        <a href="/api/lms/lessons/${lessonId}/download-lecture" class="download-btn" target="_blank">
                            <i class="bi bi-download"></i> Скачать лекцию
                        </a>
                    </div>
                ` : ''}
            </div>
        `;
        
        if (lessonData.attachments && lessonData.attachments.length > 0) {
            html += `
                <div class="attachments-section">
                    <h6 class="fw-bold mb-3"><i class="bi bi-paperclip"></i> Материалы к уроку</h6>
                    <div>
                        ${lessonData.attachments.map(att => `
                            <a href="${att.file_url}" class="attachment-item ${att.is_required ? 'required' : ''}" download>
                                <i class="bi bi-file-earmark-${getFileIcon(att.file_type)}"></i> 
                                ${escapeHtml(att.filename)}
                                ${att.is_required ? '<span class="badge bg-danger ms-1">Обязательный</span>' : ''}
                                <span class="text-muted ms-1">(${formatFileSize(att.file_size)})</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        if (lessonData.assignment && !lessonData.is_completed) {
            html += renderAssignment(lessonData.assignment);
        } else if (lessonData.assignment && lessonData.is_completed) {
            html += `
                <div class="result-card passed">
                    <i class="bi bi-check-circle-fill fs-1 text-success"></i>
                    <h5 class="mt-2">Урок пройден!</h5>
                    <p>Вы успешно завершили этот урок. Можете перейти к следующему.</p>
                    ${lessonData.next_lesson_id ? `<a href="/lesson/${lessonData.next_lesson_id}" class="btn btn-primary mt-3">Перейти к следующему уроку <i class="bi bi-arrow-right"></i></a>` : 
                     `<p class="text-muted mt-3">Это последний урок курса!</p>`}
                </div>
            `;
        }
        
        if (lessonData.next_lesson_id || lessonData.prev_lesson_id) {
            html += `<div class="navigation-buttons">`;
            if (lessonData.prev_lesson_id) {
                html += `<a href="/lesson/${lessonData.prev_lesson_id}" class="nav-btn"><i class="bi bi-arrow-left"></i> Предыдущий урок</a>`;
            } else {
                html += `<div></div>`;
            }
            if (lessonData.next_lesson_id) {
                html += `<a href="/lesson/${lessonData.next_lesson_id}" class="nav-btn">Следующий урок <i class="bi bi-arrow-right"></i></a>`;
            }
            html += `</div>`;
        }
        
        container.innerHTML = html;
        
        if (lessonData.video_url && !lessonData.is_completed) {
            initVideoTracking();
        }
        
        startTimeTracking();
    }
    
    function renderAssignment(assignment) {
        const status = assignmentStatus || {};
        const isRetakeStatus = isRetake();
        const isPendingStatus = isPending();
        const isFailedStatus = isFailed();
        const isOverdueStatus = isOverdue();
        const isPassed = status.status === 'passed';
        const noAttempts = hasNoAttempts();
        const remainingAttempts = status.remaining_attempts !== undefined ? status.remaining_attempts : 0;
        
        let sectionClass = 'assignment-section';
        if (isPassed) sectionClass += ' passed';
        else if (isFailedStatus) sectionClass += ' failed';
        else if (isPendingStatus) sectionClass += ' pending';
        else if (isRetakeStatus) sectionClass += ' retake';
        else if (isOverdueStatus) sectionClass += ' overdue';
        
        let html = `
            <div class="${sectionClass}" id="assignmentSection">
                <div class="assignment-title">
                    <i class="bi bi-pencil-square"></i>
                    ${escapeHtml(assignment.title)}
                    ${status.score !== undefined && status.score !== null ? `<span class="badge bg-primary">${status.score}/${assignment.max_score}</span>` : ''}
                    ${isPassed ? `<span class="result-passed"><i class="bi bi-check-circle"></i> Пройдено</span>` : ''}
                    ${isFailedStatus ? `<span class="result-failed"><i class="bi bi-x-circle"></i> Не пройдено</span>` : ''}
                    ${isPendingStatus ? `<span class="result-pending"><i class="bi bi-clock"></i> На проверке</span>` : ''}
                    ${isRetakeStatus ? `<span class="result-retake"><i class="bi bi-arrow-repeat"></i> На пересдачу</span>` : ''}
                    ${isOverdueStatus ? `<span class="result-overdue"><i class="bi bi-clock-history"></i> Просрочено</span>` : ''}
                </div>
                
                ${assignment.description ? `<p class="text-muted mb-4">${escapeHtml(assignment.description)}</p>` : ''}
                
                ${status.teacher_comment ? `
                    <div class="teacher-comment">
                        <span class="label"><i class="bi bi-chat"></i> Комментарий учителя:</span>
                        ${escapeHtml(status.teacher_comment)}
                    </div>
                ` : ''}
                
                ${isOverdueStatus ? `
                    <div class="deadline-warning">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span><strong>Дедлайн задания истек!</strong> Вы не можете больше отправлять ответы.</span>
                    </div>
                ` : ''}
                
                ${noAttempts ? `
                    <div class="no-attempts-message">
                        <i class="bi bi-x-circle-fill"></i>
                        <h5>Попыток больше нет</h5>
                        <p>Вы исчерпали все попытки выполнения этого задания.</p>
                        ${status.allow_retake ? '<p class="text-muted small">Обратитесь к учителю для получения дополнительной попытки.</p>' : ''}
                    </div>
                ` : ''}
        `;
        
        // Информация о пересдаче
        if (status.is_retake) {
            html += `
                <div class="retake-info">
                    <i class="bi bi-arrow-repeat"></i>
                    <strong>Пересдача #${status.retake_number}</strong>
                    ${status.remaining_attempts !== undefined ? ` • Осталось попыток: <span class="${status.remaining_attempts <= 1 ? 'text-danger' : ''}">${status.remaining_attempts}</span>` : ''}
                </div>
            `;
        }
        
        // Таймер
        if (assignment.time_limit_minutes > 0 && !status.submitted_at && !isRetakeStatus && !isPassed && !isOverdueStatus && !noAttempts) {
            const timeLimit = assignment.time_limit_minutes * 60;
            const startTime = localStorage.getItem(`assignment_start_${assignment.id}`);
            
            if (startTime) {
                const elapsed = Math.floor((Date.now() - parseInt(startTime)) / 1000);
                timeRemaining = Math.max(0, timeLimit - elapsed);
            } else {
                timeRemaining = timeLimit;
                localStorage.setItem(`assignment_start_${assignment.id}`, Date.now().toString());
            }
            
            if (timeRemaining > 0) {
                html += `
                    <div class="mb-3">
                        <span class="timer-display ${timeRemaining < 60 ? 'warning' : ''}" id="timerDisplay">
                            <i class="bi bi-clock"></i>
                            ${formatTime(timeRemaining)}
                        </span>
                        <span class="text-muted ms-2">осталось</span>
                    </div>
                `;
                startTimer(assignment.id, timeRemaining);
            } else {
                // Время вышло - автоматическая отправка
                html += `
                    <div class="deadline-warning">
                        <i class="bi bi-clock-history"></i>
                        <span><strong>Время вышло!</strong> Ответы будут отправлены автоматически.</span>
                    </div>
                `;
                setTimeout(() => submitAssignment(), 2000);
            }
        }
        
        // Сообщение о пересдаче
        if (isRetakeStatus) {
            html += `
                <div class="retake-message">
                    <i class="bi bi-arrow-repeat fs-4"></i>
                    <h5 class="mt-2">Ответ отправлен на пересдачу</h5>
                    <p>Вы можете попробовать ответить на вопросы заново.</p>
                    ${status.teacher_comment ? `
                        <div class="teacher-comment">
                            <strong>Комментарий учителя:</strong>
                            ${escapeHtml(status.teacher_comment)}
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Вопросы
        html += `<div id="questionsContainer">`;
        assignment.questions.forEach((question, idx) => {
            html += renderQuestion(question, idx, status);
        });
        html += `</div>`;
        
        // Кнопки действий
        const isSubmitted = status.status === 'submitted' || status.status === 'pending_teacher' || status.status === 'passed';
        const hasUnanswered = assignment.questions.some(q => {
            const qStatus = status.questions?.find(s => s.question_id === q.id);
            return qStatus && qStatus.status === 'not_answered';
        });
        
        // Если просрочено или нет попыток - блокируем все действия
        if (isOverdueStatus || noAttempts) {
            html += `
                <div class="alert alert-danger mt-3">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong>${isOverdueStatus ? 'Дедлайн истек.' : 'Попыток больше нет.'}</strong> 
                    ${isOverdueStatus ? 'Вы не можете больше отправлять ответы на это задание.' : 'Обратитесь к учителю.'}
                </div>
            `;
        }
        // Если статус "retake" - показываем кнопку "Попробовать снова"
        else if (isRetakeStatus && !noAttempts) {
            html += `
                <button class="retake-btn" onclick="resetProgress()">
                    <i class="bi bi-arrow-repeat me-2"></i>Пройти заново
                </button>
                <p class="text-muted small mt-2 text-center">Это сбросит ваш прогресс по уроку, и вы сможете выполнить задание заново.</p>
            `;
        } 
        // Если не отправлено и не пройдено
        else if (!isSubmitted && !isPassed && !lessonData.is_completed && !noAttempts) {
            html += `
                <button class="submit-btn" id="submitBtn" onclick="submitAssignment()" ${hasUnanswered ? 'disabled' : ''}>
                    <i class="bi bi-send me-2"></i>Отправить на проверку
                </button>
                ${hasUnanswered ? '<p class="text-danger small mt-2"><i class="bi bi-exclamation-circle"></i> Ответьте на все вопросы перед отправкой</p>' : ''}
                ${remainingAttempts > 0 ? `<p class="text-muted small mt-2 text-center">Осталось попыток: <span class="${remainingAttempts <= 1 ? 'text-danger' : ''}">${remainingAttempts}</span></p>` : ''}
            `;
        } 
        // Если пройдено - кнопка завершения урока
        else if (isPassed && !lessonData.is_completed) {
            html += `
                <button class="complete-btn" onclick="completeLesson()">
                    <i class="bi bi-check-circle me-2"></i>Завершить урок
                </button>
            `;
        } 
        // Если не пройдено и есть попытки
        else if (isFailedStatus && remainingAttempts > 0 && !noAttempts) {
            html += `
                <button class="retake-btn" onclick="resetProgress()">
                    <i class="bi bi-arrow-repeat me-2"></i>Попробовать снова (осталось ${remainingAttempts} попыток)
                </button>
            `;
        } 
        // Если ожидает проверки
        else if (isPendingStatus) {
            html += `
                <div class="waiting-message">
                    <i class="bi bi-clock-history me-2"></i>
                    Ваши ответы отправлены на проверку учителю. Дождитесь проверки, чтобы завершить урок.
                </div>
            `;
        }
        
        // Информация о попытках
        if (status.max_attempts > 0) {
            html += `
                <div class="attempts-info">
                    Попыток: ${status.attempt || 0}/${status.max_attempts}
                    ${status.is_retake ? ` • Пересдача #${status.retake_number}` : ''}
                    ${status.allow_retake ? ' • Пересдача разрешена' : ''}
                    ${remainingAttempts > 0 ? ` • Осталось: <span class="remaining ${remainingAttempts <= 1 ? 'low' : ''}">${remainingAttempts}</span>` : ''}
                    ${remainingAttempts === 0 && status.max_attempts > 0 ? ` • <span class="remaining none">Попыток больше нет</span>` : ''}
                </div>
            `;
        }
        
        html += `</div>`;
        
        return html;
    }
    
    function renderQuestion(question, idx, status) {
        const options = parseOptions(question.options);
        const qStatus = status.questions?.find(s => s.question_id === question.id);
        const isAnswered = qStatus && qStatus.is_answered;
        const isCorrect = qStatus && qStatus.is_correct === true;
        const isIncorrect = qStatus && qStatus.is_correct === false;
        const isPendingStatus = qStatus && qStatus.status === 'pending';
        const isRetakeStatus = status.status === 'retake';
        const isOverdueStatus = status.is_overdue === true;
        const noAttempts = hasNoAttempts();
        const pointsEarned = qStatus ? qStatus.points_earned : 0;
        
        let cardClass = 'question-card';
        if (isCorrect) cardClass += ' answered';
        else if (isIncorrect) cardClass += ' incorrect';
        
        let statusHtml = '';
        if (isPendingStatus) {
            statusHtml = `<div class="question-status status-pending"><i class="bi bi-clock-history"></i> Ответ отправлен, ожидает проверки</div>`;
        } else if (isCorrect) {
            statusHtml = `<div class="question-status status-approved"><i class="bi bi-check-circle"></i> Зачтено (+${pointsEarned} баллов)</div>`;
        } else if (isIncorrect) {
            statusHtml = `<div class="question-status status-rejected"><i class="bi bi-x-circle"></i> Не зачтено</div>`;
        }
        
        let inputHtml = '';
        const canAnswer = (isRetakeStatus || (qStatus && qStatus.status === 'not_answered') || !qStatus) && !isOverdueStatus && !noAttempts;
        
        if (canAnswer) {
            if (question.question_type === 'choice') {
                const savedAnswer = qStatus && qStatus.answer_text ? parseInt(qStatus.answer_text) : -1;
                inputHtml = `
                    <div class="options-list" id="options_${question.id}">
                        ${options.map((opt, optIdx) => `
                            <div class="option-item ${savedAnswer === optIdx ? 'selected' : ''}" 
                                 onclick="selectOption(${question.id}, ${optIdx})" 
                                 data-opt-index="${optIdx}">
                                <span>${String.fromCharCode(65 + optIdx)}. ${escapeHtml(opt)}</span>
                            </div>
                        `).join('')}
                        <input type="hidden" id="answer_${question.id}" name="question_${question.id}" value="${savedAnswer >= 0 ? savedAnswer : ''}">
                    </div>
                `;
            } else if (question.question_type === 'multiple') {
                const savedAnswers = qStatus && qStatus.answer_text ? JSON.parse(qStatus.answer_text) : [];
                inputHtml = `
                    <div class="options-list" id="options_${question.id}">
                        ${options.map((opt, optIdx) => `
                            <div class="option-item ${savedAnswers.includes(optIdx) ? 'selected' : ''}" 
                                 onclick="toggleMultipleOption(${question.id}, ${optIdx})" 
                                 data-opt-index="${optIdx}">
                                <input type="checkbox" class="form-check-input me-2" ${savedAnswers.includes(optIdx) ? 'checked' : ''}>
                                <span>${String.fromCharCode(65 + optIdx)}. ${escapeHtml(opt)}</span>
                            </div>
                        `).join('')}
                        <input type="hidden" id="answer_${question.id}" name="question_${question.id}" value="${JSON.stringify(savedAnswers)}">
                    </div>
                `;
            } else if (question.question_type === 'text') {
                const savedAnswer = qStatus && qStatus.answer_text ? qStatus.answer_text : '';
                inputHtml = `
                    <textarea class="text-answer" id="answer_${question.id}" name="question_${question.id}" 
                              rows="4" placeholder="Введите ваш ответ здесь...">${escapeHtml(savedAnswer)}</textarea>
                `;
            } else if (question.question_type === 'file') {
                const savedFile = qStatus && qStatus.answer_file ? qStatus.answer_file : '';
                inputHtml = `
                    <div class="file-answer-area" id="fileDrop_${question.id}" 
                         onclick="document.getElementById('fileInput_${question.id}').click()"
                         ondragover="event.preventDefault(); document.getElementById('fileDrop_${question.id}').classList.add('dragover');"
                         ondragleave="document.getElementById('fileDrop_${question.id}').classList.remove('dragover');"
                         ondrop="event.preventDefault(); document.getElementById('fileDrop_${question.id}').classList.remove('dragover'); handleFileDrop(${question.id}, event.dataTransfer.files[0]);">
                        <div class="upload-icon"><i class="bi bi-cloud-upload"></i></div>
                        <p>Нажмите или перетащите файл сюда</p>
                        <p class="text-muted small">Поддерживаются: PDF, DOC, DOCX, ZIP, RAR, JPG, PNG (макс. 50MB)</p>
                        <input type="file" id="fileInput_${question.id}" style="display: none;" 
                               accept=".pdf,.doc,.docx,.zip,.rar,.jpg,.jpeg,.png"
                               onchange="handleFileSelect(${question.id}, this.files[0])">
                    </div>
                    <div id="filePreview_${question.id}" style="display: ${savedFile ? 'flex' : 'none'};" class="file-preview">
                        <div class="file-info">
                            <i class="bi bi-file-earmark-text"></i>
                            <span id="fileName_${question.id}">${savedFile ? escapeHtml(savedFile.split('/').pop()) : ''}</span>
                            <span class="text-muted" id="fileSize_${question.id}"></span>
                        </div>
                        <button type="button" class="remove-file" onclick="removeFile(${question.id})">&times;</button>
                    </div>
                    <input type="hidden" id="answer_${question.id}" name="question_${question.id}" value="${escapeHtml(savedFile)}">
                `;
            }
        } else if (qStatus && (qStatus.status === 'pending' || qStatus.status === 'graded')) {
            if (question.question_type === 'choice') {
                const selectedIdx = parseInt(qStatus.answer_text);
                inputHtml = `
                    <div class="options-list">
                        ${options.map((opt, optIdx) => `
                            <div class="option-item ${selectedIdx === optIdx ? 'selected' : ''} ${isCorrect && selectedIdx === optIdx ? 'correct' : ''} ${isIncorrect && selectedIdx === optIdx ? 'wrong' : ''}">
                                <span>${String.fromCharCode(65 + optIdx)}. ${escapeHtml(opt)}</span>
                                ${selectedIdx === optIdx ? (isCorrect ? '<i class="bi bi-check-circle-fill text-success"></i>' : '<i class="bi bi-x-circle-fill text-danger"></i>') : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (question.question_type === 'text') {
                inputHtml = `
                    <div class="text-answer" style="background: #f8fafc; cursor: default;">
                        ${escapeHtml(qStatus.answer_text || '')}
                    </div>
                `;
            } else if (question.question_type === 'file') {
                inputHtml = `
                    <div class="file-preview" style="display: flex; background: #f8fafc;">
                        <div class="file-info">
                            <i class="bi bi-file-earmark-text"></i>
                            <span>${escapeHtml(qStatus.answer_file ? qStatus.answer_file.split('/').pop() : 'Файл')}</span>
                            ${qStatus.answer_file ? `<a href="${qStatus.answer_file}" class="btn btn-sm btn-outline-primary ms-2" target="_blank"><i class="bi bi-download"></i> Скачать</a>` : ''}
                        </div>
                    </div>
                `;
            }
        } else if (isOverdueStatus || noAttempts) {
            inputHtml = `
                <div class="alert alert-danger">
                    <i class="bi bi-${isOverdueStatus ? 'clock-history' : 'x-circle-fill'}"></i> 
                    ${isOverdueStatus ? 'Дедлайн истек.' : 'Попыток больше нет.'}
                </div>
            `;
        }
        
        return `
            <div class="${cardClass}" data-question-id="${question.id}">
                <div class="question-text">
                    ${idx + 1}. ${escapeHtml(question.question_text)}
                    ${question.is_required ? '<span class="required-mark">*</span>' : ''}
                    <span class="text-muted small ms-2">(${question.points} баллов)</span>
                </div>
                ${question.question_image ? `<img src="${question.question_image}" class="question-image">` : ''}
                ${question.hint ? `
                    <div class="question-hint">
                        <i class="bi bi-lightbulb"></i> ${escapeHtml(question.hint)}
                    </div>
                ` : ''}
                ${inputHtml}
                ${question.explanation && isCorrect ? `
                    <div class="question-explanation">
                        <i class="bi bi-info-circle"></i> ${escapeHtml(question.explanation)}
                    </div>
                ` : ''}
                ${statusHtml}
            </div>
        `;
    }
    
    function selectOption(questionId, optionIndex) {
        const container = document.querySelector(`.question-card[data-question-id="${questionId}"]`);
        if (!container) return;
        
        container.querySelectorAll('.option-item').forEach(opt => {
            opt.classList.remove('selected');
        });
        
        const selectedOpt = container.querySelector(`.option-item[data-opt-index="${optionIndex}"]`);
        if (selectedOpt) {
            selectedOpt.classList.add('selected');
        }
        
        const answerInput = document.getElementById(`answer_${questionId}`);
        if (answerInput) answerInput.value = optionIndex;
        
        checkAllAnswered();
    }
    
    function toggleMultipleOption(questionId, optionIndex) {
        const container = document.querySelector(`.question-card[data-question-id="${questionId}"]`);
        if (!container) return;
        
        const optItem = container.querySelector(`.option-item[data-opt-index="${optionIndex}"]`);
        const checkbox = optItem.querySelector('input[type="checkbox"]');
        checkbox.checked = !checkbox.checked;
        optItem.classList.toggle('selected', checkbox.checked);
        
        const selected = container.querySelectorAll('.option-item.selected');
        const selectedIndices = Array.from(selected).map(el => parseInt(el.dataset.optIndex));
        
        const answerInput = document.getElementById(`answer_${questionId}`);
        if (answerInput) answerInput.value = JSON.stringify(selectedIndices);
        
        checkAllAnswered();
    }
    
    function handleFileSelect(questionId, file) {
        if (file) {
            uploadFileAnswer(questionId, file);
        }
    }
    
    function handleFileDrop(questionId, file) {
        if (file) {
            uploadFileAnswer(questionId, file);
        }
    }
    
    async function uploadFileAnswer(questionId, file) {
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const response = await fetch(`/api/lms/questions/${questionId}/file-answer`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            
            if (response.ok) {
                const result = await response.json();
                
                const preview = document.getElementById(`filePreview_${questionId}`);
                const dropArea = document.getElementById(`fileDrop_${questionId}`);
                if (preview && dropArea) {
                    dropArea.style.display = 'none';
                    preview.style.display = 'flex';
                    document.getElementById(`fileName_${questionId}`).textContent = file.name;
                    document.getElementById(`fileSize_${questionId}`).textContent = formatFileSize(file.size);
                }
                
                const answerInput = document.getElementById(`answer_${questionId}`);
                if (answerInput) answerInput.value = result.file_url;
                
                checkAllAnswered();
                if (window.showToast) window.showToast('Файл загружен', 'success');
            } else {
                const error = await response.json();
                if (window.showToast) window.showToast(error.detail || 'Ошибка загрузки файла', 'danger');
            }
        } catch (error) {
            console.error('Upload error:', error);
            if (window.showToast) window.showToast('Ошибка загрузки файла', 'danger');
        }
    }
    
    function removeFile(questionId) {
        const preview = document.getElementById(`filePreview_${questionId}`);
        const dropArea = document.getElementById(`fileDrop_${questionId}`);
        if (preview && dropArea) {
            preview.style.display = 'none';
            dropArea.style.display = 'block';
        }
        
        const answerInput = document.getElementById(`answer_${questionId}`);
        if (answerInput) answerInput.value = '';
        
        const fileInput = document.getElementById(`fileInput_${questionId}`);
        if (fileInput) fileInput.value = '';
        
        checkAllAnswered();
    }
    
    function checkAllAnswered() {
        if (!lessonData || !lessonData.assignment) return;
        
        const questions = lessonData.assignment.questions;
        let allAnswered = true;
        
        for (const question of questions) {
            const answerInput = document.getElementById(`answer_${question.id}`);
            if (!answerInput) continue;
            
            const value = answerInput.value;
            if (!value || value === '') {
                allAnswered = false;
                break;
            }
        }
        
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
            submitBtn.disabled = !allAnswered;
        }
    }
    
    function startTimer(assignmentId, seconds) {
        if (timerInterval) {
            clearInterval(timerInterval);
        }
        
        timerInterval = setInterval(() => {
            timeRemaining--;
            
            const display = document.getElementById('timerDisplay');
            if (display) {
                display.innerHTML = `<i class="bi bi-clock"></i> ${formatTime(timeRemaining)}`;
                if (timeRemaining < 60) {
                    display.classList.add('warning');
                }
            }
            
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                if (window.showToast) window.showToast('⏰ Время вышло! Ответы будут отправлены автоматически.', 'warning');
                submitAssignment();
            }
        }, 1000);
    }
    
    function startTimeTracking() {
        if (timeTrackingInterval) {
            clearInterval(timeTrackingInterval);
        }
        
        timeTrackingInterval = setInterval(() => {
            timeSpentSeconds++;
        }, 1000);
    }
    
    async function submitAssignment() {
        if (isSubmitting) return;
        isSubmitting = true;
        
        const form = document.getElementById('assignmentSection');
        if (!form) {
            isSubmitting = false;
            return;
        }
        
        if (isOverdue()) {
            if (window.showToast) window.showToast('⚠️ Дедлайн истек! Вы не можете отправить ответы.', 'danger');
            isSubmitting = false;
            return;
        }
        
        if (hasNoAttempts()) {
            if (window.showToast) window.showToast('⚠️ Попыток больше нет!', 'danger');
            isSubmitting = false;
            return;
        }
        
        const questions = lessonData.assignment.questions;
        const answers = [];
        
        for (const question of questions) {
            const answerInput = document.getElementById(`answer_${question.id}`);
            if (!answerInput) continue;
            
            const value = answerInput.value;
            if (value && value !== '') {
                answers.push({
                    question_id: question.id,
                    answer_text: value,
                    answer_file: question.question_type === 'file' ? value : null
                });
            }
        }
        
        if (answers.length === 0) {
            if (window.showToast) window.showToast('Нет ответов для отправки', 'warning');
            isSubmitting = false;
            return;
        }
        
        const btn = document.getElementById('submitBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Отправка...';
        }
        
        try {
            const response = await fetch(`/api/lms/assignments/${lessonData.assignment.id}/submit`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    answers: answers,
                    time_spent_seconds: timeSpentSeconds,
                    is_retake: isRetake()
                })
            });
            
            if (response.ok) {
                const result = await response.json();
                
                if (result.has_text_answers || result.has_file_answers) {
                    if (window.showToast) window.showToast('📤 Ответы отправлены на проверку!', 'success');
                } else if (result.passed) {
                    if (window.showToast) window.showToast('✅ Задание пройдено!', 'success');
                } else {
                    if (window.showToast) window.showToast(result.message || 'Ответы сохранены', 'info');
                }
                
                // Обновляем статус задания
                await loadAssignmentStatus();
                renderLesson();
                
            } else {
                const error = await response.json().catch(() => ({}));
                if (window.showToast) window.showToast(error.detail || 'Ошибка отправки', 'danger');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-send me-2"></i>Отправить на проверку';
                }
            }
        } catch (error) {
            console.error('Submit error:', error);
            if (window.showToast) window.showToast('Ошибка соединения', 'danger');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send me-2"></i>Отправить на проверку';
            }
        }
        
        isSubmitting = false;
    }
    
    async function completeLesson() {
        const btn = document.querySelector('.complete-btn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Отметка...';
        }
        
        try {
            const response = await fetch(`/api/lms/lessons/${lessonId}/complete`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (response.ok) {
                if (window.showToast) window.showToast('✅ Урок отмечен как пройденный!', 'success');
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                    if (lessonData.assignment) {
                        localStorage.removeItem(`assignment_start_${lessonData.assignment.id}`);
                    }
                }
                if (timeTrackingInterval) {
                    clearInterval(timeTrackingInterval);
                }
                
                setTimeout(() => {
                    if (lessonData.next_lesson_id) {
                        if (confirm('Урок пройден! Перейти к следующему уроку?')) {
                            window.location.href = `/lesson/${lessonData.next_lesson_id}`;
                        } else {
                            location.reload();
                        }
                    } else {
                        location.reload();
                    }
                }, 1500);
            } else {
                const error = await response.json().catch(() => ({}));
                if (window.showToast) window.showToast(error.detail || 'Ошибка', 'danger');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Завершить урок';
                }
            }
        } catch (error) {
            console.error('Complete lesson error:', error);
            if (window.showToast) window.showToast('Ошибка соединения', 'danger');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Завершить урок';
            }
        }
    }
    
    async function resetProgress() {
        if (!confirm('Вы уверены, что хотите сбросить прогресс урока? Все ваши ответы и попытки будут удалены, и вы сможете пройти урок заново.')) return;
        
        const btn = document.querySelector('.retake-btn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Сброс...';
        }
        
        try {
            const response = await fetch(`/api/lms/lessons/${lessonId}/reset-progress`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (response.ok) {
                if (window.showToast) window.showToast('🔄 Прогресс сброшен! Вы можете пройти урок заново.', 'success');
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                    if (lessonData.assignment) {
                        localStorage.removeItem(`assignment_start_${lessonData.assignment.id}`);
                    }
                }
                
                setTimeout(() => location.reload(), 1500);
            } else {
                const error = await response.json().catch(() => ({}));
                if (window.showToast) window.showToast(error.detail || 'Ошибка сброса', 'danger');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-arrow-repeat me-2"></i>Пройти заново';
                }
            }
        } catch (error) {
            console.error('Reset error:', error);
            if (window.showToast) window.showToast('Ошибка соединения', 'danger');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-arrow-repeat me-2"></i>Пройти заново';
            }

    function getEmbedUrl(url) {
        if (!url) return '';
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
            let videoId = '';
            if (url.includes('youtu.be')) {
                videoId = url.split('/').pop()?.split('?')[0];
            } else {
                videoId = url.split('v=')[1]?.split('&')[0];
            }
            return `https://www.youtube.com/embed/${videoId}`;
        }
        return url;
    }
    
    function initVideoTracking() {
        if (!lessonData || !lessonData.video_url || lessonData.is_completed) return;
        
        const videoContainer = document.getElementById('videoContainer');
        if (!videoContainer) return;
        
        const iframe = document.querySelector('#lessonVideo');
        if (iframe) {
            iframe.addEventListener('load', () => {
                if (videoCheckInterval) {
                    clearInterval(videoCheckInterval);
                }
                
                videoCheckInterval = setInterval(() => {
                    iframe.contentWindow?.postMessage(
                        JSON.stringify({
                            event: 'command',
                            func: 'getCurrentTime'
                        }),
                        '*'
                    );
                }, 5000);
            });
        }
        
        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://www.youtube.com') return;
            
            try {
                const data = JSON.parse(event.data);
                if (data.event === 'infoDelivery' && data.info && data.info.currentTime !== undefined) {
                    const currentTime = data.info.currentTime;
                    const duration = data.info.duration || 0;
                    
                    if (duration > 0) {
                        const percent = Math.round((currentTime / duration) * 100);
                        const progressFill = document.getElementById('videoProgressFill');
                        if (progressFill) {
                            progressFill.style.width = `${Math.min(percent, 100)}%`;
                        }
                        
                        if (percent > 0 && percent % 5 === 0) {
                            sendVideoProgress(Math.round(currentTime), Math.round(duration));
                        }
                    }
                }
            } catch (e) {
                // Игнорируем не-JSON сообщения
            }
        });
    }
    
    async function sendVideoProgress(position, totalDuration) {
        try {
            const response = await fetch(`/api/lms/lessons/${lessonId}/video-progress?position_seconds=${position}&total_duration=${totalDuration}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            
            if (response.ok) {
                const data = await response.json();
                if (data.is_completed) {
                    if (window.showToast) window.showToast('✅ Урок пройден!', 'success');
                    setTimeout(() => location.reload(), 2000);
                }
            }
        } catch (error) {
            console.error('Error sending video progress:', error);
        }
    }
    
    window.addEventListener('beforeunload', () => {
        if (videoCheckInterval) {
            clearInterval(videoCheckInterval);
        }
        if (timerInterval) {
            clearInterval(timerInterval);
        }
        if (timeTrackingInterval) {
            clearInterval(timeTrackingInterval);
        }
    });
</script>
